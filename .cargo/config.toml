# rustc records its working directory (the checkout) in every artifact's debug info, so the same unit compiled in two
# sheds differs in bytes, and every task keyed on those outputs (the napi .node, test binaries) re-keys per checkout.
# A relative remap keeps the flag itself checkout-independent (specs/cowshed/16_build_volumes.md, "No absolute checkout
# paths in compiler flags").
[build]
rustflags = ["-Zremap-cwd-prefix=."]

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = true }

# Cargo hashes the linker spelling into every unit. Keep it checkout-independent;
# the dev shell installs this program in the immutable store on Darwin.
# A target's rustflags replace build.rustflags, so they repeat the cwd remap. `-Zosx-rpath-install-name` names a dylib
# `@rpath/<name>` instead of its absolute path in the shed's target. The Mach-O debug map's object paths are mbx's: it
# spells every target input of a native link by the target's physical root and strips that root with its own
# `-oso_prefix`, which a caller's prefix would override. So a linked artifact is the same in every shed.
[target.aarch64-apple-darwin]
linker = "smoothbricks-macos-linker"
rustflags = ["-Zremap-cwd-prefix=.", "-Zosx-rpath-install-name"]

[target.x86_64-apple-darwin]
linker = "smoothbricks-macos-linker"
rustflags = ["-Zremap-cwd-prefix=.", "-Zosx-rpath-install-name"]

# One feature resolution for the whole workspace. Without it every per-crate
# cargo invocation resolves features for its own selection, so one shared
# dependency is compiled once per selection and no warm target directory is
# reused across crates. Requires the nightly channel the managed devenv
# module pins; on a stable toolchain a cargo-hakari workspace-hack does the
# same job. Both keys are needed: cargo ignores [resolver] without the
# [unstable] opt-in.
[unstable]
feature-unification = true
# Cargo stamps each unit's fingerprint hash file on every use, Fresh included,
# so the nx-plugin's retention tells a unit still in use from one only built
# long ago. It changes no unit hash and no freshness verdict.
mtime-on-use = true

[resolver]
feature-unification = "workspace"
