[env]
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = true }

# Cargo hashes the linker spelling into every unit. Keep it checkout-independent;
# the dev shell installs this program in the immutable store on Darwin.
[target.aarch64-apple-darwin]
linker = "smoothbricks-macos-linker"

[target.x86_64-apple-darwin]
linker = "smoothbricks-macos-linker"

# One feature resolution for the whole workspace. Without it every per-crate
# cargo invocation resolves features for its own selection, so one shared
# dependency is compiled once per selection and no warm target directory is
# reused across crates. Requires the nightly channel the managed devenv
# module pins; on a stable toolchain a cargo-hakari workspace-hack does the
# same job. Both keys are needed: cargo ignores [resolver] without the
# [unstable] opt-in.
[unstable]
feature-unification = true
checksum-freshness = true
# Cargo stamps each unit's fingerprint hash file on every use, Fresh included,
# so the nx-plugin's retention tells a unit still in use from one only built
# long ago. It changes no unit hash and no freshness verdict.
mtime-on-use = true

[resolver]
feature-unification = "workspace"

[build]
fingerprint = "content"
