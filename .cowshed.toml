# Repository-owned cowshed settings (specs/cowshed/06_cli.md "Configuration").

[build]
# Build state no capability detects, kept on the build volume instead of the source image
# (specs/cowshed/16_build_volumes.md "Declared build state"): cloned at fork, adopted by main at
# land. `.cache/ttsc-plugins` is the shell's TTSC_CACHE_DIR (ttsc-env.sh): ttsc's native plugin
# binaries; `.cache/ttsc` holds its TTSC_GO_CACHE_DIR (go-build), the Go build cache that
# compiles them. A plugin's key hashes its sources by relative path plus the ttsc/tsgo versions,
# platform and Go environment, never the checkout, and GOFLAGS=-trimpath keeps paths out of the
# Go cache, so an entry built in any checkout is valid in every fork. On the source image a fork
# gets only main's copy, which no land writes, so its first compile rebuilds every plugin main
# never built.
#
# Not declared: `.cache/nextest` and `.cache/lmao-thread-ffi` are Nx task outputs, which never
# live on the build volume (16_build_volumes.md "Nx outputs never live in the build volume"); the
# Nx cache restores them. `.cache/statebus-packages` is the packed-consumer verification's declared
# Nx output on the same footing; its consumer lockfiles name tarballs workspace-relatively.
state = [".cache/ttsc-plugins", ".cache/ttsc"]

[land]
# The declared land (specs/cowshed/02_workspaces.md "A declared land"): `cowshed land <ws>` takes this land turn,
# rebases <ws> onto main, runs the gate below on the host in main's pure environment, fast-forwards main under the ref
# turn smoothbricks.ref (rebasing and gating again when main moved) and retires <ws>, then runs the after commands and
# pushes main to codebase, detached.
turn = "smoothbricks"
gate = ["sh", "tooling/land-host.sh", "--gate", "{workspace}"]
push = "codebase"
# First main's built products: the ordinary compiler outputs, whose producer receipts consumers' snapshot captures read,
# then exactly the build units developer links in other checkouts judge stale here (tooling/rebuild-linked.ts runs the
# link judge's own rebuilds, so no unit a link reads is left out); Nx restores the outputs the gate cached for the same
# tree, so both are cache hits. Then the install of a land that changed cowshed.
after = [
  ["bun", "nx", "run-many", "-t", "build", "--outputStyle=static-failures-only"],
  ["bun", "tooling/rebuild-linked.ts"],
  ["sh", "tooling/land-install.sh", "smoothbricks", "{before}", "{head}"],
]

[doc]
# `cowshed doc-commit`: Markdown reaches main under the ref turn with no shed and no gate of its own; the next land
# gates any task that hashes it. The check runs in main with the edit's paths appended, before they are staged, and
# refuses an edit that leaves a code reference in a spec naming nothing in the tree the commit holds (the refusal root
# lint's spec-links gives every land's gate) or that carries a file a crate compiles in, which a code task hashes
# (tooling/checks/doc-lane.ts). The commit's pre-commit hook formats the Markdown.
paths = ["*.md", "*.markdown", "*.mdx"]
check = ["bun", "tooling/checks/doc-lane.ts"]
