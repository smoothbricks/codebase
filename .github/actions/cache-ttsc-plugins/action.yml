name: Cache ttsc plugins
description: >
  Restore/save compiled ttsc native plugin binaries (typia, etc.). These are content-keyed under TTSC_CACHE_DIR/plugins
  and skip the multi-minute `go build` when the cache key matches. The Go object cache (go-build/) is NOT cached — it is
  multi-GB and only helps when the plugin key misses.

inputs:
  scope:
    description: >
      Build environment the binaries were compiled in. ttsc keys a plugin on its Go build environment, so binaries from
      the devenv shell and from a Bun-only prologue never share a key; each environment keeps its own segment. The key
      carries no repository source: a CLI or plugin change compiles against the cached binary in seconds.
    required: false
    default: devenv

runs:
  using: composite
  steps:
    - name: Cache ttsc plugin binaries
      uses: actions/cache@v5.0.5
      with:
        # Only the compiled plugin binaries (~30MB each). Path is relative to the
        # workspace; devenv sets TTSC_CACHE_DIR to <repo>/.cache/ttsc.
        path: .cache/ttsc/plugins
        # prettier-ignore
        key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ inputs.scope }}-v1-${{ hashFiles('bun.lock', 'package.json', 'patches/ttsc@*.patch', 'tooling/direnv/devenv.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ inputs.scope }}-v1-
