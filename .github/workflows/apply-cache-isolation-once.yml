name: Verify cache isolation patch
on:
  push:
    branches: [fix/ci-host-cache-ref-isolation]
    paths: [.github/workflows/apply-cache-isolation-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'smoothbricks/codebase' && github.ref == 'refs/heads/fix/ci-host-cache-ref-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Run the dependency-free regression in a clean fixture
        run: |
          fixture="$RUNNER_TEMP/cache-scope-fixture"
          mkdir -p "$fixture/packages/nx-plugin/src/managed-files" "$fixture/packages/nx-plugin/managed/templates/github/actions/setup-devenv"
          cp packages/nx-plugin/src/managed-files/github-host-cache-isolation.test.ts "$fixture/packages/nx-plugin/src/managed-files/"
          cp packages/nx-plugin/managed/templates/github/actions/setup-devenv/action.yml "$fixture/packages/nx-plugin/managed/templates/github/actions/setup-devenv/"
          echo "CACHE_FIXTURE=$fixture" >> "$GITHUB_ENV"
          cd "$fixture"
          if bun test packages/nx-plugin/src/managed-files/github-host-cache-isolation.test.ts; then
            echo 'Expected the unpatched cache scope to fail the regression test.' >&2
            exit 1
          fi
      - name: Repair the managed template and its checked-in consumer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scope = '        scope=$(printf \'%s\\0%s\\0%s\\0%s\\0%s\' "$GITHUB_WORKFLOW" "$GITHUB_REF" "$GITHUB_JOB" "$RUNNER_OS" "$RUNNER_ARCH" | git hash-object --stdin)'
          replacements = [
              ('        NX_CACHE_ROOT="/var/cache/ci/nx/$NX_CACHE_REPO/${lane:-default}"', scope + '\n        NX_CACHE_ROOT="/var/cache/ci/nx/$NX_CACHE_REPO/${lane:-default}/$scope"'),
              ('        root="/var/cache/ci/devenv/$DEVENV_STATE_REPO/${lane:-default}/$DEVENV_STATE_JOB"', scope + '\n        root="/var/cache/ci/devenv/$DEVENV_STATE_REPO/${lane:-default}/$DEVENV_STATE_JOB/$scope"'),
              ('        stable="/work/$DEVENV_STATE_REPO/${lane:-default}/$DEVENV_STATE_JOB"', '        stable="/work/$DEVENV_STATE_REPO/${lane:-default}/$DEVENV_STATE_JOB/$scope"'),
              ('    # mid-read; that is what failed a release with a bare non-zero\n    # `nx show project`. Per lane they stay warm and never overlap.', '    # mid-read. CI concurrency is per workflow/ref, not workflow alone:\n    # separate PRs and jobs must never share mutable graph or eval state.\n    # Hash the exact identity (not a lossy path slug); keep cache artifacts\n    # and their metadata DB together, warm across runs of the same ref/job.'),
              ('    # Scoped per job as well as lane: two jobs of one run are parallel, and one\n    # eval-cache.db has one writer.', '    # Scoped per workflow/ref/job/platform like Nx: separate PR runs and\n    # jobs can overlap, and one eval-cache.db must have only one writer.'),
          ]
          for name in ['packages/nx-plugin/managed/templates/github/actions/setup-devenv/action.yml', '.github/actions/setup-devenv/action.yml']:
              path = Path(name)
              text = path.read_text()
              for old, new in replacements:
                  assert text.count(old) == 1, (name, old)
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          bunx --package @biomejs/biome@2.5.12 biome format --write packages/nx-plugin/src/managed-files/github-host-cache-isolation.test.ts
          cp packages/nx-plugin/managed/templates/github/actions/setup-devenv/action.yml "$CACHE_FIXTURE/packages/nx-plugin/managed/templates/github/actions/setup-devenv/"
          cp packages/nx-plugin/src/managed-files/github-host-cache-isolation.test.ts "$CACHE_FIXTURE/packages/nx-plugin/src/managed-files/"
          (cd "$CACHE_FIXTURE" && bun test packages/nx-plugin/src/managed-files/github-host-cache-isolation.test.ts)
          git diff --check
      - name: Commit only the reviewed template and regression test
        run: |
          git add .github/actions/setup-devenv/action.yml packages/nx-plugin/managed/templates/github/actions/setup-devenv/action.yml packages/nx-plugin/src/managed-files/github-host-cache-isolation.test.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ci): isolate mutable host caches by workflow ref and job'
          git push origin HEAD:refs/heads/fix/ci-host-cache-ref-isolation
