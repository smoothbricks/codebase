name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  # actions:write lets the drift step dispatch the managed-files workflow.
  actions: write
  contents: read
  statuses: write

concurrency:
  # This workflow validates and never deploys, so there is no in-flight
  # deployment for a newer push to protect: every pull request, and every ref
  # for pushes, cancels its superseded runs. Queuing them instead serializes
  # the staging branch, and a burst of pushes then reports the newest commit
  # one full run per queued push late.
  group: CI-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tooling/direnv

jobs:
  main:
    name: Validate
    runs-on:
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      fromJSON('["nixos-latest-x64","self-hosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history includes blobs needed by nx affected after checkout credentials are removed.
          fetch-depth: 0
          persist-credentials: false

      # Step 3. Composite action internals do not affect top-level job step
      # anchors; update the nx-smart --step values below if top-level steps move.
      - name: 🧱 Setup Nix/devenv
        id: setup
        uses: ./.github/actions/setup-devenv

      # --- Nx -----------------------------------------------------------------

      # Step 4
      # Sets the base and head SHAs required for the nx affected commands
      - name: 🧭 Set Nx SHAs
        if: github.server_url == 'https://github.com' || endsWith(github.api_url, '/api/v3')
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          workflow-id: ci.yml

      # Step 5
      - name: 🧠 Restore Nx cache
        id: nx-cache
        if: steps.setup.outputs.host-runner != 'true'
        uses: ./.github/actions/cache-nx

      # Step 6
      - name: 🔨 Build
        run: NX_VERBOSE_LOGGING=true smoo github-ci nx-smart --target build --name "Build" --step 6

      # Step 7
      - name: 🔍 Lint
        run: smoo github-ci nx-smart --target lint --name "Lint" --step 7

      - name: diag closure watcher start
        run: |
          root="$(cd ../.. && pwd)"
          mkdir -p /tmp/ebr-ws && ln -sfn "$root/node_modules" /tmp/ebr-ws/node_modules && echo '{}' > /tmp/ebr-ws/package.json
          cat > /tmp/ebr-ws/watch.ts <<EOF
          import { createRequire } from 'node:module';
          import { appendFileSync, lstatSync, readdirSync } from 'node:fs';
          import { graphInstallationIdentity, nodeStamp } from '$root/packages/nx-plugin/dist/ensure-built-witness.js';
          const root = '/tmp/ebr-ws';
          const out = '/tmp/ebr-ws/changes.log';
          const req = createRequire(root + '/package.json');
          const pj = req('nx/src/utils/package-json');
          const { expandOutputs } = req('nx/src/native');
          const id = graphInstallationIdentity(root, { plugins: ['@smoothbricks/nx-plugin'] }, pj.readModulePackageJson, expandOutputs, null, (d) => appendFileSync(out, 'UNPROVED ' + d + '\n'));
          const stats = new Map(JSON.parse(id).nodes.map((n) => [n.path, lstatSync(n.path, { bigint: true })]));
          const names = new Map([...stats].filter(([, s]) => s.isDirectory()).map(([p]) => [p, readdirSync(p)]));
          const fields = ['dev', 'ino', 'mode', 'nlink', 'size', 'mtimeNs', 'ctimeNs'];
          appendFileSync(out, new Date().toISOString() + ' watching ' + stats.size + '\n');
          let n = 0;
          for (;;) {
            for (const [path, before] of stats) {
              let now;
              try { now = lstatSync(path, { bigint: true }); } catch (e) { appendFileSync(out, new Date().toISOString() + ' GONE ' + path + '\n'); stats.delete(path); continue; }
              if (nodeStamp(now) !== nodeStamp(before) || now.nlink !== before.nlink) {
                let extra = '';
                if (names.has(path)) { const was = names.get(path); const is = readdirSync(path); names.set(path, is); extra = ' added=' + JSON.stringify(is.filter((x) => !was.includes(x))) + ' removed=' + JSON.stringify(was.filter((x) => !is.includes(x))); }
                if (n++ < 400) appendFileSync(out, new Date().toISOString() + ' MOVED ' + path + ' ' + fields.filter((f) => now[f] !== before[f]).map((f) => f + ':' + String(before[f]) + '->' + String(now[f])).join(',') + extra + '\n');
                stats.set(path, now);
              }
            }
            await Bun.sleep(20);
          }
          EOF
          nohup bun /tmp/ebr-ws/watch.ts > /tmp/ebr-ws/watch.out 2>&1 &
          sleep 20; cat /tmp/ebr-ws/changes.log /tmp/ebr-ws/watch.out

      # Step 8
      - name: 🧪 Unit Tests
        run: smoo github-ci nx-smart --target test --name "Unit Tests" --step 8

      - name: diag closure watcher report
        if: always()
        run: |
          echo "WATCHREPORT begin"; cat /tmp/ebr-ws/changes.log /tmp/ebr-ws/watch.out; echo "WATCHREPORT end"

      # Step 9
      - name: 🌐 Browser Tests
        run: smoo github-ci nx-smart --target test-browser --name "Browser Tests" --step 9

      # Step 10
      - name: 🩺 Check monorepo policies and managed-file drift
        id: managed-drift
        run: smoo monorepo check --warn

      # Step 11
      - name: 🔁 Dispatch managed-file drift healing
        if: >-
          ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
          github.event.repository.default_branch) && steps.managed-drift.outputs.drifted != '' &&
          steps.managed-drift.outputs.drifted != '0' }}
        run: smoo github-ci dispatch-workflow --workflow managed-files.yml --ref "$GITHUB_REF_NAME"

      # Step 12
      # Nx's database cache needs artifact files and .nx/workspace-data DB
      # metadata restored together; GitHub Actions cache is only the archive
      # transport. Save runs only after prior required steps succeed on the default
      # branch, so PRs may restore shared cache but cannot publish it.
      #
      # Host-nix runners skip the transport entirely: setup-devenv puts their
      # Nx cache on the shared /var/cache/ci bind, which already survives the
      # job, so shipping it through the Actions cache would upload a copy of a
      # cache the next job reads directly.
      - name: 💾 Save Nx cache
        if:
          ${{ steps.setup.outputs.host-runner != 'true' && github.event_name == 'push' && github.ref ==
          format('refs/heads/{0}', github.event.repository.default_branch) && steps.nx-cache.outputs.cache-hit != 'true'
          }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .nx/cache
            .nx/workspace-data/*.db*
          key: ${{ runner.os }}-${{ runner.arch }}-nx-db-v1-${{ github.sha }}

      # Step 13
      - name: 📎 Upload trace DBs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-results-${{ github.run_id }}
          path: |
            packages/*/.cache/lmao/trace-results.db*
            ${{ job.status == 'failure' && format('{0}/project-graph.json', env.NX_WORKSPACE_DATA_DIRECTORY || '.nx/workspace-data') || '' }}
            ${{ job.status == 'failure' && format('{0}/d/daemon.log', env.NX_WORKSPACE_DATA_DIRECTORY || '.nx/workspace-data') || '' }}
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

      # --- Cleanup ------------------------------------------------------------

      # Step 14
      - name: 🧹 Cleanup and cache Nix/devenv
        # always() still saves after a red job. Nix NAR is ephemeral-only;
        # devenv eval-cache also saves on host-nix when setup missed.
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}
