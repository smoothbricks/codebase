name: Verify PR lint repair
on:
  push:
    branches: [maintenance/lint-check-20260917]
    paths:
      - .github/workflows/lint-check-once.yml
      - maintenance/fix_patchnote_lint*.mjs
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: maintenance-lint-check-20260917
  cancel-in-progress: false
jobs:
  lint:
    if: github.repository == 'smoothbricks/codebase' && github.ref == 'refs/heads/maintenance/lint-check-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Retain reviewed repair helpers
        run: |
          cp maintenance/fix_patchnote_lint.mjs "$RUNNER_TEMP/repair-source.mjs"
          cp maintenance/fix_patchnote_lint_checked.mjs "$RUNNER_TEMP/repair-checked.mjs"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 115142bc063ee989df55844d70117d3176bfc3fe
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - name: Install the exact original dependency graph
        run: |
          bun install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Apply guarded type and validation repairs
        env:
          REPAIR_SOURCE: ${{ runner.temp }}/repair-source.mjs
        run: |
          node "$RUNNER_TEMP/repair-checked.mjs" > "$RUNNER_TEMP/verify-apply.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/verify-apply.log"; exit 1; }
      - name: Resolve the new dependency edges and format the patch
        run: |
          {
            bun install --lockfile-only --ignore-scripts
            bun install --frozen-lockfile
            python3 - <<'PY'
          import json, os, subprocess
          paths = json.load(open(os.environ['RUNNER_TEMP']+'/patchnote-changed.json'))
          subprocess.run(['biome','check','--write','--files-ignore-unknown=true',*paths],check=True)
          PY
          } > "$RUNNER_TEMP/verify-prepare.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/verify-prepare.log"; exit 1; }
      - name: Verify Nx lint and its build and type prerequisites
        id: lint
        run: |
          nx lint @smoothbricks/patchnote --output-style=static > "$RUNNER_TEMP/verify-lint.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/verify-lint.log"; exit 1; }
      - name: Run the full package test target
        id: tests
        run: |
          nx test @smoothbricks/patchnote --output-style=static > "$RUNNER_TEMP/verify-tests.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/verify-tests.log"; exit 1; }
      - name: Verify built Node validation without a Bun preload
        id: packed
        run: |
          node packages/patchnote/dist/cli.js --help
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { mkdtemp, mkdir, writeFile, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { loadConfig, defaultConfig } from './packages/patchnote/dist/index.js';
          const root = await mkdtemp(join(tmpdir(),'patchnote-built-'));
          try {
            await mkdir(join(root,'tooling'));
            const path = join(root,'tooling/patchnote.json');
            await writeFile(path,JSON.stringify({prStrategy:{maxStackDepth:12}}));
            assert.equal((await loadConfig(root,'tooling/patchnote.json')).prStrategy.maxStackDepth,12);
            await writeFile(path,JSON.stringify({prStrategy:{maxStackDepth:'invalid'}}));
            assert.equal((await loadConfig(root,'tooling/patchnote.json')).prStrategy.maxStackDepth,defaultConfig.prStrategy.maxStackDepth);
          } finally { await rm(root,{recursive:true,force:true}); }
          console.log('Built Node validation passed');
          JS
          git diff --check
      - name: Record results and prepare a verified commit without moving the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PACKED_OUTCOME: ${{ steps.packed.outcome }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess, urllib.error, urllib.parse, urllib.request
          root='https://api.github.com/repos/smoothbricks/codebase/'
          branch='maintenance/lint-check-20260917'
          expected='115142bc063ee989df55844d70117d3176bfc3fe'
          def api(path,data=None,method=None):
              request=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),method=method,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          def save(path,text):
              payload={'message':'chore: retain lint repair verification [skip ci]','branch':branch,'content':base64.b64encode(text.encode()).decode()}
              try: payload['sha']=api('contents/'+path+'?ref='+urllib.parse.quote(branch,safe=''))['sha']
              except urllib.error.HTTPError as error:
                  if error.code!=404: raise
              api('contents/'+path,payload,'PUT')
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          result={'source':expected,'run_id':os.environ['GITHUB_RUN_ID'],'lint':os.environ['LINT_OUTCOME'],'tests':os.environ['TEST_OUTCOME'],'built_node':os.environ['PACKED_OUTCOME']}
          for name in ['verify-apply','verify-prepare','verify-lint','verify-tests']:
              path=tmp/(name+'.log')
              if path.exists():
                  text=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',path.read_text())
                  save('maintenance/lint-20260917/'+name+'.txt',text[-190000:]+'\n')
          listed=tmp/'patchnote-changed.json'
          if listed.exists():
              paths=json.loads(listed.read_text())+['bun.lock']
              extras=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
              paths+= [p for p in extras if p.startswith('packages/patchnote/') and p.endswith('.json')]
              paths=sorted(set(paths))
              assert all(p.startswith('packages/patchnote/') or p=='bun.lock' for p in paths)
              subprocess.run(['git','add','--intent-to-add','--',*paths],check=True)
              diff=subprocess.check_output(['git','diff','--',*paths],text=True)
              save('maintenance/lint-20260917/repair.diff',diff)
              result['paths']=paths
              if all(result[k]=='success' for k in ['lint','tests','built_node']):
                  assert api('pulls/1')['head']['sha']==expected,'PR head changed; refuse stale candidate'
                  entries=[]
                  for p in paths:
                      tracked=subprocess.check_output(['git','ls-tree','HEAD','--',p],text=True)
                      mode=tracked.split()[0] if tracked else '100644'
                      entries.append({'path':p,'mode':mode,'type':'blob','content':pathlib.Path(p).read_text()})
                  parent=api('git/commits/'+expected)
                  tree=api('git/trees',{'base_tree':parent['tree']['sha'],'tree':entries},'POST')
                  commit=api('git/commits',{'message':'fix(patchnote): validate external data and remove unsafe assertions','tree':tree['sha'],'parents':[expected]},'POST')
                  result['candidate']=commit['sha']
                  result['tree']=tree['sha']
          save('maintenance/lint-20260917/verification.json',json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
