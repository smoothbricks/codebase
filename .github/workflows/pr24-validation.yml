name: CLI refactor validation

on:
  push:
    branches: [assist/pr24-validation]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --no-summary
      - name: Export dependencies for local validation
        run: |
          mkdir -p "$RUNNER_TEMP/cli-refactor-runtime"
          tar -czf "$RUNNER_TEMP/cli-refactor-runtime/dependencies.tar.gz" node_modules $(find packages targets tooling -mindepth 2 -maxdepth 2 -type d -name node_modules)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-refactor-runtime
          path: ${{ runner.temp }}/cli-refactor-runtime
          retention-days: 1
          if-no-files-found: error
