name: CLI refactor validation

on:
  push:
    branches: [assist/pr24-validation]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --no-summary
      - name: Export shared packages for local validation
        run: |
          mkdir -p "$RUNNER_TEMP/cli-refactor-cache"
          tar -czf - -C "$HOME" .bun/install/cache/links | split -b 300m - "$RUNNER_TEMP/cli-refactor-cache/cache-"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-refactor-cache-first
          path: ${{ runner.temp }}/cli-refactor-cache/cache-aa
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-refactor-cache-second
          path: ${{ runner.temp }}/cli-refactor-cache/cache-ab
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
