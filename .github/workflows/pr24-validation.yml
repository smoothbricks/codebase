name: CLI refactor validation

on:
  push:
    branches: [assist/pr24-validation]

permissions:
  contents: read

jobs:
  generator-contract:
    runs-on: [nixos-latest-x64, self-hosted]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tooling/direnv
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: fc6b982ef8dfdee13d68e617e6c01a2927c963b1
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
        id: setup
      - name: Build using the repository toolchain
        run: nx run-many -t build -p nx-plugin,cli
      - name: Exercise the native Nx entry points
        run: |
          set -euo pipefail
          nx generate @smoothbricks/nx-plugin:managed-files --dry-run --interactive=false
          nx generate @smoothbricks/nx-plugin:managed-files --interactive=false
          nx sync
          nx sync:check
          git diff --binary > "$RUNNER_TEMP/first-generation.diff"
          nx generate @smoothbricks/nx-plugin:managed-files --interactive=false
          nx sync:check
          git diff --binary > "$RUNNER_TEMP/second-generation.diff"
          cmp "$RUNNER_TEMP/first-generation.diff" "$RUNNER_TEMP/second-generation.diff"
      - name: Verify packaged generator assets
        working-directory: packages/nx-plugin
        run: |
          set -euo pipefail
          bun pm pack --filename "$RUNNER_TEMP/nx-plugin.tgz"
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'nx-plugin.tgz') as archive:
              members = {member.name for member in archive.getmembers()}
              for path in ['dist/managed-files/generator.js', 'src/managed-files/schema.json', 'managed/raw/tooling/devenv', 'managed/raw/tooling/direnv/devenv.smoo.nix']:
                  assert f'package/{path}' in members, path
              registry = json.load(archive.extractfile('package/generators.json'))
              declaration = registry['generators']['managed-files']
              for field in ['factory', 'schema']:
                  assert 'package/' + declaration[field].removeprefix('./') in members, declaration[field]
          print('Packaged generator entry point, schema and managed assets verified.')
          PY
      - name: Save validation diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-generator-diagnostics
          path: |
            ${{ runner.temp }}/first-generation.diff
            ${{ runner.temp }}/second-generation.diff
          if-no-files-found: ignore
          retention-days: 1
      - uses: ./.github/actions/save-nix-devenv
        if: always()
        with:
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}
