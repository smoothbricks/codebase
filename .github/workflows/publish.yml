name: Publish

on:
  workflow_dispatch:
    inputs:
      bootstrap_readiness:
        type: boolean
        description: Check a fresh macOS Cowshed host only; all release jobs are disabled in this mode.
        default: false
      bootstrap_main:
        type: string
        description: Exact current main commit to adopt in readiness mode. Ignored for normal releases.
        default: ''
      bump:
        type: choice
        description:
          Use auto for conventional commits, or force a semver bump. Prerelease publishes to next; all others publish to
          latest.
        options: [auto, patch, minor, major, prerelease]
        default: auto
      projects:
        type: string
        description:
          Comma-separated Nx projects to release, or all for every owned release package. Blank releases package-local
          changes since the last release, whatever the bump mode is.
        default: ''
      dry_run:
        type: boolean
        description: Run release commands without writing versions, tags, publishes, or GitHub Releases.
        default: false

permissions:
  contents: read

concurrency:
  group:
    ${{ inputs.bootstrap_readiness && format('cowshed-bootstrap-readiness-{0}', github.repository) ||
    format('release-{0}', github.ref) }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: tooling/direnv

jobs:
  linux-release-candidate:
    if: ${{ !inputs.bootstrap_readiness }}
    runs-on:
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      fromJSON('["nixos-latest-x64","self-hosted"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: none
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      release-sha: ${{ steps.release-state.outputs.sha }}
    env:
      LMAO_GIT_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://10.89.0.1:8765
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_REMOTE_CACHE_TOKEN }}
      MBX_REMOTE_URL: http://127.0.0.1:8766
      MBX_REMOTE_NAMESPACE: smoothbricks
      # prettier-ignore
      MBX_REMOTE_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.MBX_REMOTE_TOKEN || secrets.MBX_REMOTE_READ_TOKEN }}
      # prettier-ignore
      MBX_REMOTE_TRUST_WRITES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      # --- Setup --------------------------------------------------------------

      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # No remote is read or written from this job: the clone is complete and the
          # candidate commit leaves only as the transferred bundle.
          persist-credentials: false

      # Step 3. Composite action internals do not affect top-level job step
      # anchors; update these comments if top-level steps move.
      - name: 🧱 Setup Nix/devenv
        id: setup
        uses: ./.github/actions/setup-devenv
        with:
          records-workflow: CI
          records-job: main

      # Step 4
      - name: 🤖 Configure release author
        run:
          git config user.name "github-actions[bot]" && git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 5
      - name: 🏗️ Build smoo Nx version actions
        # Nx Release loads @smoothbricks/nx-plugin/version-actions through the
        # export map in its own node process, and versioning runs before the
        # build phase, so the hook must exist in dist first. Downstream
        # consumers install the published package and skip this bootstrap.
        #
        # `nx` cannot do it: the project graph loads this very plugin, so
        # `nx build nx-plugin` deadlocks on the executor it is building.
        # ttsc needs only the package tsconfig -- the bootstrap the shell entry
        # runs (tooling/direnv/enter-shell.ts) -- and emits as the typescript-emit
        # executor does (EMIT_OVERRIDES), so dist holds no build info.
        working-directory: packages/nx-plugin
        run: bun ../../tooling/ttsc-emit.ts

      # Step 6
      - name: 🧭 Plan release
        id: plan
        env:
          SMOO_RELEASE_PROJECTS: ${{ inputs.projects }}
        run:
          smoo release version --bump "${{ inputs.bump }}" --projects "$SMOO_RELEASE_PROJECTS" --dry-run "true"
          --github-output "$GITHUB_OUTPUT"

      # --- Validation ---------------------------------------------------------

      # Release validation intentionally does not restore persisted Nx task
      # cache. Nx may reuse tasks produced earlier in this same job, but publish
      # never relies on task outputs restored from CI cache. version runs before
      # validation so the commit completed below is the commit that was checked.

      # Step 7
      - name: ✅ Check managed monorepo files (${{ steps.plan.outputs.mode }})
        if: steps.plan.outputs.mode != 'none'
        run: smoo monorepo check --warn

      # Step 8
      - name: 🔍 Lint (${{ steps.plan.outputs.mode }})
        if: steps.plan.outputs.mode != 'none'
        run: smoo github-ci nx-run-many --targets lint --projects "${{ steps.plan.outputs.projects }}"

      # Step 9
      - name: 🧪 Unit Tests (${{ steps.plan.outputs.mode }})
        if: steps.plan.outputs.mode != 'none'
        run: smoo github-ci nx-run-many --targets test --projects "${{ steps.plan.outputs.projects }}"

      # Step 10
      - name: 🔢 Version release
        id: version
        env:
          SMOO_RELEASE_PROJECTS: ${{ inputs.projects }}
        run:
          smoo release version --bump "${{ inputs.bump }}" --projects "$SMOO_RELEASE_PROJECTS" --dry-run "${{
          inputs.dry_run }}" --github-output "$GITHUB_OUTPUT"

      # Step 11
      - name: 🔒 Capture candidate release SHA
        id: release-state
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Step 12
      - name: 🔨 Build (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run:
          smoo github-ci nx-run-many --targets build --projects "${{ steps.version.outputs.projects }}" --configuration
          production --collect-outputs "${{ runner.temp }}/release-build-outputs"

      # Step 13
      - name: 🐧 Build supplemental Linux targets
        if: steps.version.outputs.mode != 'none'
        run:
          smoo github-ci nx-run-many --targets "*-linux" --projects "${{ steps.version.outputs.projects }}"
          --configuration production --collect-outputs "${{ runner.temp }}/linux-platform-outputs"

      # Step 14
      - name: 📎 Upload trace DBs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trace-results-${{ github.run_id }}
          path: packages/*/.cache/lmao/trace-results.db*
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

      # Step 15
      - name: ✅ Validate monorepo config (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run: smoo monorepo validate --projects "${{ steps.version.outputs.projects }}" --repairs-pending

      # --- Candidate transfer --------------------------------------------------

      # Step 16
      - name: 📦 Bundle validated release state
        run:
          mkdir -p "${{ runner.temp }}/publish-release-state" && git bundle create "${{ runner.temp
          }}/publish-release-state/release-state.bundle" HEAD --tags && git rev-parse HEAD > "${{ runner.temp
          }}/publish-release-state/release-head"

      # Step 17
      - name: 📤 Upload validated release state
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/publish-release-state
          if-no-files-found: error
          retention-days: 1

      # Step 18
      - name: 📤 Upload validated build outputs
        if: steps.version.outputs.mode != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-release-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/release-build-outputs
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # Step 19
      - name: 📤 Upload supplemental Linux outputs
        if: steps.version.outputs.mode != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-linux-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-platform-outputs
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # --- Cleanup ------------------------------------------------------------

      # Step 20
      - name: 🧹 Cleanup and cache Nix/devenv
        # success() is default; always() still saves GH Nix cache after a red job.
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}

  macos-platform:
    if: ${{ !inputs.bootstrap_readiness }}
    runs-on: macos-latest
    strategy:
      # One architecture per runner: a leg that fails still leaves the other
      # architecture uploaded for inspection.
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: none
    env:
      LMAO_GIT_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_REMOTE_CACHE_SERVER }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_REMOTE_CACHE_TOKEN }}
      MBX_REMOTE_URL: ${{ vars.MBX_REMOTE_SERVER }}
      MBX_REMOTE_NAMESPACE: smoothbricks
      # prettier-ignore
      MBX_REMOTE_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.MBX_REMOTE_TOKEN || secrets.MBX_REMOTE_READ_TOKEN }}
      # prettier-ignore
      MBX_REMOTE_TRUST_WRITES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      # --- Setup --------------------------------------------------------------

      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # build-platform-outputs fetches the release branch and tags from origin
          # (packages/cli/src/release/index.ts:335). This job pushes nothing, but a private origin refuses
          # that fetch without the checkout credential, so it stays persisted.
          persist-credentials: true

      # Step 3. Composite action internals do not affect top-level job step
      # anchors; update these comments if top-level steps move.
      - name: 🧱 Setup Nix/devenv
        id: setup
        uses: ./.github/actions/setup-devenv
        with:
          records-workflow: CI
          records-job: main
          cache-scope: macos-platform-${{ matrix.arch }}

      # Step 4
      - name: 🏗️ Build smoo Nx version actions
        # Nx Release loads @smoothbricks/nx-plugin/version-actions through the
        # export map in its own node process, and versioning runs before the
        # build phase, so the hook must exist in dist first. Downstream
        # consumers install the published package and skip this bootstrap.
        #
        # `nx` cannot do it: the project graph loads this very plugin, so
        # `nx build nx-plugin` deadlocks on the executor it is building.
        # ttsc needs only the package tsconfig -- the bootstrap the shell entry
        # runs (tooling/direnv/enter-shell.ts) -- and emits as the typescript-emit
        # executor does (EMIT_OVERRIDES), so dist holds no build info.
        working-directory: packages/nx-plugin
        run: bun ../../tooling/ttsc-emit.ts

      # Step 5
      - name: 🤖 Configure release author
        run:
          git config user.name "github-actions[bot]" && git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 6
      - name: 🔢 Version release
        id: version
        env:
          SMOO_RELEASE_PROJECTS: ${{ inputs.projects }}
        run:
          smoo release version --bump "${{ inputs.bump }}" --projects "$SMOO_RELEASE_PROJECTS" --dry-run "${{
          inputs.dry_run }}" --github-output "$GITHUB_OUTPUT"

      # Step 7
      - name: 🍎 Build selected macOS and iOS release outputs (${{ matrix.arch }})
        id: platform-outputs
        env:
          SMOO_RELEASE_PROJECTS: ${{ inputs.projects }}
        run:
          smoo release build-platform-outputs --bump "${{ inputs.bump }}" --projects "$SMOO_RELEASE_PROJECTS" --ref "${{
          github.sha }}" --targets "*-${{ matrix.arch }}-macos" --output "${{ runner.temp }}/macos-platform-outputs"
          --github-output "$GITHUB_OUTPUT"

      # Step 8
      - name: 🧪 Unit test selected macOS and iOS packages
        # Only the runner-native leg can execute what it built; the foreign
        # architecture ships as an artifact without running here.
        if: matrix.arch == 'arm64' && steps.platform-outputs.outputs.projects != ''
        run: smoo github-ci nx-run-many --targets test --projects "${{ steps.platform-outputs.outputs.projects }}"

      # Step 9
      - name: 📤 Upload macOS platform outputs (${{ matrix.arch }})
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-macos-${{ matrix.arch }}-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-platform-outputs
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # --- Cleanup ------------------------------------------------------------

      # Step 10
      - name: 🧹 Cleanup and cache Nix/devenv
        # success() is default; always() still saves GH Nix cache after a red job.
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}

  publish-on-linux:
    if: ${{ !inputs.bootstrap_readiness }}
    needs: [linux-release-candidate, macos-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    env:
      LMAO_GIT_REVISION: ${{ github.sha }}
      TTSC_TSGO_BINARY: ${{ github.workspace }}/node_modules/@typescript/native/bin/tsc
      GH_TOKEN: ${{ github.token }}
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_REMOTE_CACHE_SERVER }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_REMOTE_CACHE_TOKEN }}
      MBX_REMOTE_URL: ${{ vars.MBX_REMOTE_SERVER }}
      MBX_REMOTE_NAMESPACE: smoothbricks
      # prettier-ignore
      MBX_REMOTE_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.MBX_REMOTE_TOKEN || secrets.MBX_REMOTE_READ_TOKEN }}
      # prettier-ignore
      MBX_REMOTE_TRUST_WRITES: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      # --- Setup --------------------------------------------------------------

      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # smoo publish and pending-release repair push release refs.
          persist-credentials: true

      # Step 3
      - name: 🧱 Setup Nix/devenv
        # Pending release repair builds historical npm gaps before the current
        # verified artifacts are restored, so this job still needs the full
        # toolchain even though current release publishing is prebuilt-only.
        id: setup
        uses: ./.github/actions/setup-devenv
        with:
          records-workflow: CI
          records-job: main

      # Step 4
      - name: 📥 Download candidate artifacts
        if: success()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: publish-*-${{ github.run_id }}
          path: ${{ runner.temp }}/publish-artifacts
          merge-multiple: false

      # Step 5
      - name: 🤖 Configure release author
        run:
          git config user.name "github-actions[bot]" && git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 6
      - name: 🏗️ Build smoo Nx version actions
        # Nx Release loads @smoothbricks/nx-plugin/version-actions through the
        # export map in its own node process, and that export has no source
        # condition, so the next-prerelease bump inside smoo release publish
        # needs dist/version-actions.cjs on disk. Downstream consumers install
        # the published package and skip this bootstrap.
        #
        # `nx` cannot do it: the project graph loads this very plugin, so
        # `nx build nx-plugin` deadlocks on the executor it is building.
        # ttsc needs only the package tsconfig -- the bootstrap the shell entry
        # runs (tooling/direnv/enter-shell.ts) -- and emits as the typescript-emit
        # executor does (EMIT_OVERRIDES), so dist holds no build info.
        working-directory: packages/nx-plugin
        run: bun ../../tooling/ttsc-emit.ts

      # --- Repair -------------------------------------------------------------

      # Step 7
      - name: 🧯 Repair pending releases
        run:
          smoo release repair-pending --ref "${{ github.sha }}" --platform-outputs "${{ runner.temp
          }}/publish-artifacts/publish-macos-arm64-outputs-${{ github.run_id }}/repairs,${{ runner.temp
          }}/publish-artifacts/publish-macos-x64-outputs-${{ github.run_id }}/repairs" --dry-run "${{ inputs.dry_run }}"

      # Step 8
      - name: ♻️ Restore validated release state
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.linux-release-candidate.outputs.release-sha }}
        run: |
          set -euo pipefail
          state="${{ runner.temp }}/publish-artifacts/publish-release-state-${{ github.run_id }}"
          actual="$(cat "$state/release-head")"
          if [ -z "$EXPECTED_RELEASE_SHA" ] || [ "$actual" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Release state does not match the validated candidate SHA." >&2
            exit 1
          fi
          git bundle verify "$state/release-state.bundle"
          git fetch "$state/release-state.bundle" HEAD --tags
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Release bundle HEAD does not match the validated candidate SHA." >&2
            exit 1
          fi
          git reset --hard "$EXPECTED_RELEASE_SHA"

      # --- Validation ---------------------------------------------------------

      # Step 9
      - name: 📦 Apply verified Linux outputs
        if: needs.linux-release-candidate.outputs.mode != 'none'
        run:
          smoo github-ci apply-outputs --source-sha "${{ needs.linux-release-candidate.outputs.release-sha }}" "${{
          runner.temp }}/publish-artifacts/publish-release-outputs-${{ github.run_id }}" "${{ runner.temp
          }}/publish-artifacts/publish-linux-outputs-${{ github.run_id }}"

      # Step 10
      - name: 🍎 Apply verified macOS outputs
        if: needs.linux-release-candidate.outputs.mode != 'none'
        run:
          smoo github-ci apply-outputs --source-sha "${{ github.sha }}" "${{ runner.temp
          }}/publish-artifacts/publish-macos-arm64-outputs-${{ github.run_id }}/current" "${{ runner.temp
          }}/publish-artifacts/publish-macos-x64-outputs-${{ github.run_id }}/current"

      # --- Release ------------------------------------------------------------

      # Step 11
      - name: 🏷️ Tag release
        # Ordered before the publish below so an interrupted release stays
        # detectable by the repair step at the top of this job on a later run.
        run: smoo release tag --dry-run "${{ inputs.dry_run }}"

      # Step 12
      - name: 📦 Publish release (${{ needs.linux-release-candidate.outputs.mode }})
        # Pack verified outputs; --prebuilt refuses missing artifacts rather than rebuilding.
        # Public npm packages use trusted publishing/OIDC after local bootstrap.
        run:
          smoo release publish --prebuilt "${{ runner.temp }}/publish-artifacts/publish-release-outputs-${{
          github.run_id }}" "${{ runner.temp }}/publish-artifacts/publish-linux-outputs-${{ github.run_id }}" "${{
          runner.temp }}/publish-artifacts/publish-macos-arm64-outputs-${{ github.run_id }}/current" "${{ runner.temp
          }}/publish-artifacts/publish-macos-x64-outputs-${{ github.run_id }}/current" --bump "${{ inputs.bump }}"
          --dry-run "${{ inputs.dry_run }}"

      # --- Cleanup ------------------------------------------------------------

      # Step 13
      - name: 🧹 Cleanup and cache Nix/devenv
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}

  cowshed-bootstrap-readiness:
    if: ${{ inputs.bootstrap_readiness }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}/..
        shell: bash
    env:
      EXPECTED_MAIN: ${{ inputs.bootstrap_main }}
    steps:
      - name: Require a fresh owned host and an exact main pin
        id: probe-root
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = smoothbricks/codebase
          case "$GITHUB_REF" in
            refs/heads/support/alex-mextner/gl668-hosted-macos-readiness-*) ;;
            *) echo "::error::Use the dedicated bootstrap support branch"; exit 1 ;;
          esac
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          for path in "$HOME/Library/Application Support/dev.cowshed" /private/cowshed "$GITHUB_WORKSPACE/.cowshed"; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::Refusing an existing Cowshed host or project: $path"
              exit 1
            fi
          done
          PROBE_ROOT="$RUNNER_TEMP/cowshed-bootstrap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$PROBE_ROOT"
          mkdir "$PROBE_ROOT/evidence"
          printf 'PROBE_ROOT=%s\n' "$PROBE_ROOT" >> "$GITHUB_ENV"
          printf '%s\n' "$EXPECTED_MAIN" > "$PROBE_ROOT/evidence/expected-main.txt"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned canonical main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.bootstrap_main }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current main before executing its setup action
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_MAIN"
          current=$(git ls-remote https://github.com/smoothbricks/codebase.git refs/heads/main)
          test "$current" = "$(printf '%s\trefs/heads/main' "$EXPECTED_MAIN")"
          git -C "$GITHUB_WORKSPACE" switch --create main "$EXPECTED_MAIN"
          checkout_status=$(git -C "$GITHUB_WORKSPACE" status --porcelain)
          test -z "$checkout_status"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD 'HEAD^{tree}' > "$PROBE_ROOT/evidence/source.txt"

      - name: Install the official multi-user Nix host prerequisite
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test ! -e /nix
          test ! -L /nix
          case "$(uname -m)" in
            arm64) system=aarch64-darwin; checksum=71e18301c4ea78c667f2753159156b5bdb899993720e8aa7bcca97e8312d3d6b ;;
            x86_64) system=x86_64-darwin; checksum=8bf3dadfd65be182ad3141b1224bbc82e0f2a61d4f36781938b5e6ede029c2a3 ;;
            *) echo "::error::Unsupported macOS architecture"; exit 1 ;;
          esac
          nix_root="$PROBE_ROOT/nix"
          mkdir "$nix_root"
          payload="$nix_root/nix-2.34.7-$system.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://releases.nixos.org/nix/nix-2.34.7/nix-2.34.7-$system.tar.xz" --output "$payload"
          printf '%s  %s\n' "$checksum" "$payload" | shasum -a 256 -c -
          tar -xJf "$payload" -C "$nix_root"
          # Cachix configures this disposable CI user's cache through the multi-user daemon.
          printf 'experimental-features = nix-command flakes\naccept-flake-config = true\ntrusted-users = root %s\n' "$(id -un)" > "$nix_root/nix.conf"
          "$nix_root/nix-2.34.7-$system/install" --daemon --yes --no-channel-add \
            --nix-extra-conf-file "$nix_root/nix.conf" 2>&1 | tee "$PROBE_ROOT/evidence/nix-install.log"
          /usr/bin/dscl . -read /Groups/nixbld > "$PROBE_ROOT/evidence/nix-build-group.txt"
          /bin/launchctl print system/org.nixos.nix-daemon > "$PROBE_ROOT/evidence/nix-daemon.txt"
          /nix/var/nix/profiles/default/bin/nix --store daemon store ping
          /nix/var/nix/profiles/default/bin/nix --version > "$PROBE_ROOT/evidence/nix-version.txt"
          {
            printf '%s\n' /nix/var/nix/profiles/default/bin
            printf '%s\n' "$HOME/.nix-profile/bin"
          } >> "$GITHUB_PATH"
          printf 'NIX_REMOTE=daemon\nDEVENV_WORKDIR=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Enable the canonical public devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
          skipPush: true

      - name: Install the canonical locked devenv
        timeout-minutes: 25
        working-directory: ${{ github.workspace }}/tooling/direnv
        run: ./github-actions-bootstrap.sh install-devenv

      - name: Prepare the canonical devenv shell
        timeout-minutes: 25
        working-directory: ${{ github.workspace }}/tooling/direnv
        run: ./github-actions-bootstrap.sh build-shell

      - name: Use the existing rooted Bun profile
        run: |
          set -euo pipefail
          stable_bin="${DEVENV_WORKDIR:?}/tooling/direnv/.devenv/profile/bin"
          test -x "$stable_bin/bun"
          printf '%s\n' "$stable_bin" >> "$GITHUB_PATH"
          printf 'COWSHED_BUN_PROFILE_BIN=%s\n' "$stable_bin" >> "$GITHUB_ENV"
          printf '%s\n' "$stable_bin" > "$PROBE_ROOT/evidence/bun-profile-bin.txt"

      - name: Install locked direnv in a native-discoverable host profile
        run: |
          set -euo pipefail
          # Native capability discovery ignores ambient PATH and searches host profiles.
          direnv_bin="$(python3 -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$COWSHED_BUN_PROFILE_BIN/direnv")"
          direnv_store="$(dirname "$(dirname "$direnv_bin")")"
          host_profile="$HOME/.local/state/nix/profile"
          mkdir -p "$(dirname "$host_profile")"
          nix profile add --profile "$host_profile" "$direnv_store"
          cmp "$direnv_bin" "$host_profile/bin/direnv"
          "$host_profile/bin/direnv" version | tee "$PROBE_ROOT/evidence/direnv-version.txt"
          printf '%s\n' "$direnv_store" > "$PROBE_ROOT/evidence/direnv-store.txt"

      - name: Install published Cowshed 0.5.2 with its dependencies
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://registry.npmjs.org/@smoothbricks/cowshed/-/cowshed-0.5.2.tgz \
            --output "$PROBE_ROOT/cowshed-0.5.2.tgz"
          python3 - <<'PY'
          import base64, hashlib, os, pathlib
          root = pathlib.Path(os.environ["PROBE_ROOT"])
          payload = (root / "cowshed-0.5.2.tgz").read_bytes()
          expected = "PGF6/yb9/dpHVvFTEjy5jwF+7Qvno4k0Uxac4ZAYtiahgDbqRg/8AC4ASHg+YYB3IhtL3ZIvlpBbNXX4TGKLDw=="
          actual = base64.b64encode(hashlib.sha512(payload).digest()).decode()
          if actual != expected:
              raise SystemExit("published Cowshed package integrity mismatch")
          (root / "evidence/package-integrity.txt").write_text("sha512-" + actual + "\n")
          PY
          tar -xzf "$PROBE_ROOT/cowshed-0.5.2.tgz" -C "$PROBE_ROOT"
          mkdir "$PROBE_ROOT/install"
          printf '{"private":true,"dependencies":{"@smoothbricks/cowshed":"file:../cowshed-0.5.2.tgz"}}\n' \
            > "$PROBE_ROOT/install/package.json"
          (cd "$PROBE_ROOT/install" && bun install)
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["PROBE_ROOT"])
          package = json.loads((root / "package/package.json").read_text())
          if package["name"] != "@smoothbricks/cowshed" or package["version"] != "0.5.2":
              raise SystemExit("unexpected Cowshed package identity")
          (root / "evidence/package.json").write_text(json.dumps({
              "name": package["name"], "version": package["version"]
          }, indent=2) + "\n")
          PY
          case "$(uname -m)" in
            arm64) platform=darwin-arm64 ;;
            x86_64) platform=darwin-x64 ;;
            *) echo "::error::Unsupported macOS architecture"; exit 1 ;;
          esac
          native="$PROBE_ROOT/install/node_modules/@smoothbricks/cowshed/dist/bin/$platform/cowshed"
          test -x "$native"
          cmp "$PROBE_ROOT/package/dist/bin/$platform/cowshed" "$native"
          shasum -a 256 "$native" > "$PROBE_ROOT/evidence/native-sha256.txt"
          printf 'COWSHED_NATIVE=%s\n' "$native" >> "$GITHUB_ENV"

      - name: Record the initial native diagnosis
        run: |
          set -euo pipefail
          set +e
          "$COWSHED_NATIVE" --json doctor > "$PROBE_ROOT/evidence/doctor-before.json" 2> "$PROBE_ROOT/evidence/doctor-before.stderr.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$PROBE_ROOT/evidence/doctor-before.exit"
          cat "$PROBE_ROOT/evidence/doctor-before.json"
          cat "$PROBE_ROOT/evidence/doctor-before.stderr.log" >&2
          # Exit 5 is the native doctor result for error findings on an unconfigured host.
          # It is retained as a diagnostic, never reported as successful setup.
          test "$code" -eq 0 || test "$code" -eq 5

      - name: Run ordinary Cowshed setup
        id: cowshed-setup
        timeout-minutes: 5
        run: |
          set -euo pipefail
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          "$COWSHED_NATIVE" setup 2>&1 | tee "$PROBE_ROOT/evidence/setup.log"

      - name: Start the installed gateway and require native readiness
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Native gateway start waits for healthy control-socket service.
          "$COWSHED_NATIVE" --json gateway start | tee "$PROBE_ROOT/evidence/gateway-start.json"
          "$COWSHED_NATIVE" --json gateway status | tee "$PROBE_ROOT/evidence/gateway-before-adopt.json"

      - name: Adopt only the pinned canonical main
        id: cowshed-adopt
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_MAIN"
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          "$COWSHED_NATIVE" adopt "$GITHUB_WORKSPACE" 2>&1 | tee "$PROBE_ROOT/evidence/adopt.log"
          main_path=$("$COWSHED_NATIVE" --project "$GITHUB_WORKSPACE" path main)
          test "$(git -C "$main_path" rev-parse HEAD)" = "$EXPECTED_MAIN"
          checkout_status=$(git -C "$main_path" status --porcelain)
          test -z "$checkout_status"
          git -C "$main_path" rev-parse HEAD 'HEAD^{tree}' > "$PROBE_ROOT/evidence/adopted-source.txt"
          test -x "$COWSHED_BUN_PROFILE_BIN/bun"
          # Gateway start can reload projects; check adopted main only after its health wait.
          "$COWSHED_NATIVE" --json gateway start | tee "$PROBE_ROOT/evidence/gateway-adopted.json"
          "$COWSHED_NATIVE" --project "$main_path" --json doctor | tee "$PROBE_ROOT/evidence/doctor-adopted.json"
          printf 'Published Cowshed setup, gateway health, and pinned main adoption passed.\n' \
            > "$PROBE_ROOT/evidence/readiness.txt"

      - name: Unadopt this probe's project through the native command
        if: ${{ always() && steps.cowshed-adopt.outputs.attempted == 'true' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          "$COWSHED_NATIVE" --project "$GITHUB_WORKSPACE" unadopt 2>&1 | tee "$PROBE_ROOT/evidence/unadopt.log"
          test -x "$COWSHED_BUN_PROFILE_BIN/bun"

      - name: Remove this probe's installed host presence through the native command
        if: ${{ always() && steps.cowshed-setup.outputs.attempted == 'true' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          "$COWSHED_NATIVE" setup --uninstall 2>&1 | tee "$PROBE_ROOT/evidence/uninstall.log"
          # Native uninstall preserves volumes and retained checkouts. The disposable
          # hosted VM removes those when the job ends; this probe never forces deletion.

      - name: Retain the readiness evidence
        if: ${{ always() && steps.probe-root.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cowshed-bootstrap-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROBE_ROOT }}/evidence/
          if-no-files-found: error
