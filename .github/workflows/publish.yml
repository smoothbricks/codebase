name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description:
          Use auto for conventional commits, or force a semver bump. Prerelease publishes to next; all others publish to
          latest.
        options: [auto, patch, minor, major, prerelease]
        default: auto
      projects:
        type: string
        description:
          Comma-separated Nx projects to release, or all for every owned release package. Blank releases package-local
          changes since the last release, whatever the bump mode is.
        default: ''
      dry_run:
        type: boolean
        description: Run release commands without writing versions, tags, publishes, or GitHub Releases.
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: tooling/direnv

jobs:
  linux-release-candidate:
    runs-on:
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      fromJSON('["nixos-latest-x64","self-hosted"]') || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: none
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      release-sha: ${{ steps.release-state.outputs.sha }}
    env:
      NIX_STORE_NAR: ${{ github.workspace }}/nix-store.nar
      GH_TOKEN: ${{ github.token }}
    steps:
      # --- Setup --------------------------------------------------------------

      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 0

      # Step 3. Composite action internals do not affect top-level job step
      # anchors; update these comments if top-level steps move.
      - name: 🧱 Setup Nix/devenv
        id: setup
        uses: ./.github/actions/setup-devenv

      # Step 4
      - name: 🤖 Configure release author
        run:
          git config user.name "github-actions[bot]" && git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 5
      - name: 🏗️ Build smoo Nx version actions
        # Nx Release loads @smoothbricks/nx-plugin/version-actions through the
        # export map in its own node process, and versioning runs before the
        # build phase, so the hook must exist in dist first. Downstream
        # consumers install the published package and skip this bootstrap.
        #
        # `nx` cannot do it: the project graph loads this very plugin, so
        # `nx build nx-plugin` deadlocks on the executor it is building.
        # ttsc needs only the package tsconfig -- same bootstrap the devenv
        # shell runs (tooling/direnv/enter-shell.ts).
        working-directory: packages/nx-plugin
        run: ttsc -p tsconfig.lib.json --emit

      # Step 6
      - name: 🔢 Version release
        id: version
        run:
          smoo release version --bump "${{ inputs.bump }}" --projects "${{ inputs.projects }}" --dry-run "${{
          inputs.dry_run }}" --github-output "$GITHUB_OUTPUT"

      # Step 7
      - name: 🔒 Capture candidate release SHA
        id: release-state
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # --- Validation ---------------------------------------------------------

      # Release validation intentionally does not restore persisted Nx task
      # cache. Nx may reuse tasks produced earlier in this same job, but publish
      # never relies on task outputs restored from CI cache. version runs before
      # validation so the commit completed below is the commit that was checked.

      # Step 8
      - name: ✅ Check managed monorepo files (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run: smoo monorepo check --warn

      # Step 9
      - name: 🔨 Build (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run:
          smoo github-ci nx-run-many --targets build --projects "${{ steps.version.outputs.projects }}"
          --collect-outputs "${{ runner.temp }}/release-build-outputs"

      # Step 10
      - name: 🐧 Build supplemental Linux targets
        if: steps.version.outputs.mode != 'none'
        run:
          smoo github-ci nx-run-many --targets "*-linux" --projects "${{ steps.version.outputs.projects }}"
          --collect-outputs "${{ runner.temp }}/linux-platform-outputs"

      # Step 11
      - name: 🔍 Lint (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run: smoo github-ci nx-run-many --targets lint --projects "${{ steps.version.outputs.projects }}"

      # Step 12
      - name: 🧪 Unit Tests (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run: smoo github-ci nx-run-many --targets test --projects "${{ steps.version.outputs.projects }}"

      # Step 13
      - name: 📎 Upload trace DBs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trace-results-${{ github.run_id }}
          path: packages/*/.cache/trace-results.db*
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

      # Step 14
      - name: ✅ Validate monorepo config (${{ steps.version.outputs.mode }})
        if: steps.version.outputs.mode != 'none'
        run: smoo monorepo validate

      # --- Candidate transfer --------------------------------------------------

      # Step 15
      - name: 📦 Bundle validated release state
        run:
          mkdir -p "${{ runner.temp }}/publish-release-state" && git bundle create "${{ runner.temp
          }}/publish-release-state/release-state.bundle" HEAD --tags && git rev-parse HEAD > "${{ runner.temp
          }}/publish-release-state/release-head"

      # Step 16
      - name: 📤 Upload validated release state
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publish-release-state-${{ github.run_id }}
          path: ${{ runner.temp }}/publish-release-state
          if-no-files-found: error
          retention-days: 1

      # Step 17
      - name: 📤 Upload validated build outputs
        if: steps.version.outputs.mode != 'none'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publish-release-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/release-build-outputs
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # Step 18
      - name: 📤 Upload supplemental Linux outputs
        if: steps.version.outputs.mode != 'none'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publish-linux-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-platform-outputs
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # --- Cleanup ------------------------------------------------------------

      # Step 19
      - name: 🧹 Cleanup and cache Nix/devenv
        # success() is default; always() still saves GH Nix cache after a red job.
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          nix-cache-hit: ${{ steps.setup.outputs.nix-cache-hit }}
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}

  macos-platform:
    runs-on: macos-latest
    strategy:
      # One architecture per runner: a leg that fails still leaves the other
      # architecture uploaded for inspection.
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    permissions:
      contents: read
      id-token: none
    outputs:
      platform_work: ${{ steps.plan.outputs.platform_work }}
    env:
      NIX_STORE_NAR: ${{ github.workspace }}/nix-store.nar
      # The same root devenv derives, so the Bun-only prologue and the shell
      # share the restored plugin binaries (and never write under node_modules).
      TTSC_CACHE_DIR: ${{ github.workspace }}/.cache/ttsc
      TTSC_TSGO_BINARY: ${{ github.workspace }}/node_modules/@typescript/native/bin/tsc
      GH_TOKEN: ${{ github.token }}

    steps:
      # --- Setup --------------------------------------------------------------

      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout dispatch commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 0

      # --- Plan (Bun only) ---------------------------------------------------
      # Whether this runner has anything to build -- the release selection, its
      # platform targets, and the pending releases only it can repair -- is
      # git, the Nx graph, npm and GitHub metadata. Bun runs smoo and Nx
      # directly, so the ten-minute Nix setup below is spent only on a run.
      # The dependency segments restore here, once: bun install is then a
      # lockfile check and ttsc finds its compiled plugins instead of building
      # them with Go; setup-devenv is told not to restore them again.

      # Step 3
      - name: 📦 Restore node_modules
        uses: ./.github/actions/cache-node-modules

      # Step 4
      - name: 🧊 Restore ttsc plugins
        uses: ./.github/actions/cache-ttsc-plugins

      # Step 5
      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Step 6
      - name: 📦 Install workspace dependencies
        # repo-path exposes smoo: the source shim here, node_modules/.bin elsewhere.
        working-directory: .
        run: |
          bun install --frozen-lockfile
          tooling/direnv/repo-path --github-path

      # Step 7
      - name: 🏗️ Build smoo Nx version actions
        # Nx Release loads @smoothbricks/nx-plugin/version-actions through the
        # export map in its own node process, and both the plan preview and
        # versioning run it, so the hook must exist in dist first. Downstream
        # consumers install the published package and skip this bootstrap.
        #
        # `nx` cannot do it: the project graph loads this very plugin, so
        # `nx build nx-plugin` deadlocks on the executor it is building.
        # ttsc needs only the package tsconfig -- same bootstrap the devenv
        # shell runs (tooling/direnv/enter-shell.ts).
        working-directory: packages/nx-plugin
        run: bunx ttsc -p tsconfig.lib.json --emit

      # Step 8
      - name: 🗺️ Plan platform outputs
        id: plan
        env:
          NX_VERBOSE_LOGGING: 'true'
        run:
          smoo release build-platform-outputs --plan --bump "${{ inputs.bump }}" --projects "${{ inputs.projects }}"
          --ref "${{ github.sha }}" --targets "*-macos" --github-output "$GITHUB_OUTPUT"

      # --- Setup (only with work) --------------------------------------------

      # Step 9. Composite action internals do not affect top-level job step
      # anchors; update these comments if top-level steps move.
      - name: 🧱 Setup Nix/devenv
        id: setup
        if: steps.plan.outputs.platform_work == 'true'
        uses: ./.github/actions/setup-devenv
        with:
          dependencies-restored: 'true'

      # Step 10
      - name: 🤖 Configure release author
        if: steps.plan.outputs.platform_work == 'true'
        run:
          git config user.name "github-actions[bot]" && git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 11
      - name: 🔢 Version release
        id: version
        if: steps.plan.outputs.platform_work == 'true'
        run:
          smoo release version --bump "${{ inputs.bump }}" --projects "${{ inputs.projects }}" --dry-run "${{
          inputs.dry_run }}" --github-output "$GITHUB_OUTPUT"

      # Step 12
      - name: 🍎 Build selected macOS and iOS release outputs (${{ matrix.arch }})
        id: platform-outputs
        if: steps.plan.outputs.platform_work == 'true'
        run:
          smoo release build-platform-outputs --bump "${{ inputs.bump }}" --projects "${{ inputs.projects }}" --ref "${{
          github.sha }}" --targets "*-${{ matrix.arch }}-macos" --output "${{ runner.temp }}/macos-platform-outputs"
          --github-output "$GITHUB_OUTPUT"

      # Step 13
      - name: 🧪 Unit test selected macOS and iOS packages
        # Only the runner-native leg can execute what it built; the foreign
        # architecture ships as an artifact without running here.
        if: matrix.arch == 'arm64' && steps.platform-outputs.outputs.projects != ''
        run: smoo github-ci nx-run-many --targets test --projects "${{ steps.platform-outputs.outputs.projects }}"

      # Step 14
      - name: 📤 Upload macOS platform outputs (${{ matrix.arch }})
        if: steps.plan.outputs.platform_work == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: publish-macos-${{ matrix.arch }}-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-platform-outputs
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      # --- Cleanup ------------------------------------------------------------

      # Step 15
      - name: 🧹 Cleanup and cache Nix/devenv
        # always() still saves GH Nix cache after a red job; a runner the plan
        # kept toolchain-free has no cache to save.
        if: always() && steps.plan.outputs.platform_work == 'true'
        uses: ./.github/actions/save-nix-devenv
        with:
          nix-cache-hit: ${{ steps.setup.outputs.nix-cache-hit }}
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}

  publish-on-linux:
    needs: [linux-release-candidate, macos-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NIX_STORE_NAR: ${{ github.workspace }}/nix-store.nar
      TTSC_TSGO_BINARY: ${{ github.workspace }}/node_modules/@typescript/native/bin/tsc
      GH_TOKEN: ${{ github.token }}
    steps:
      # --- Setup --------------------------------------------------------------

      # Step 1: GitHub adds "Set up job" automatically
      # Step 2
      - name: 📥 Checkout dispatch commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 0

      # Step 3
      - name: 🧱 Setup Nix/devenv
        # Pending release repair builds historical npm gaps before the current
        # verified artifacts are restored, so this job still needs the full
        # toolchain even though current release publishing is prebuilt-only.
        id: setup
        uses: ./.github/actions/setup-devenv

      # Step 4
      - name: 📥 Download candidate artifacts
        if: success()
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: publish-*-${{ github.run_id }}
          path: ${{ runner.temp }}/publish-artifacts
          merge-multiple: false

      # Step 5
      - name: 🤖 Configure release author
        run:
          git config user.name "github-actions[bot]" && git config user.email
          "41898282+github-actions[bot]@users.noreply.github.com"

      # Step 6
      - name: 🏗️ Build smoo Nx version actions
        # Nx Release loads @smoothbricks/nx-plugin/version-actions through the
        # export map in its own node process, and that export has no source
        # condition, so the next-prerelease bump inside smoo release publish
        # needs dist/version-actions.cjs on disk. Downstream consumers install
        # the published package and skip this bootstrap.
        #
        # `nx` cannot do it: the project graph loads this very plugin, so
        # `nx build nx-plugin` deadlocks on the executor it is building.
        # ttsc needs only the package tsconfig -- same bootstrap the devenv
        # shell runs (tooling/direnv/enter-shell.ts).
        working-directory: packages/nx-plugin
        run: ttsc -p tsconfig.lib.json --emit

      # --- Repair -------------------------------------------------------------

      # Step 7
      - name: 🧯 Repair pending releases
        run:
          smoo release repair-pending --ref "${{ github.sha }}" --platform-outputs "${{ runner.temp
          }}/publish-artifacts/publish-macos-arm64-outputs-${{ github.run_id }}/repairs,${{ runner.temp
          }}/publish-artifacts/publish-macos-x64-outputs-${{ github.run_id }}/repairs" --dry-run "${{ inputs.dry_run }}"

      # Step 8
      - name: ♻️ Restore validated release state
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.linux-release-candidate.outputs.release-sha }}
        run: |
          set -euo pipefail
          state="${{ runner.temp }}/publish-artifacts/publish-release-state-${{ github.run_id }}"
          actual="$(cat "$state/release-head")"
          if [ -z "$EXPECTED_RELEASE_SHA" ] || [ "$actual" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Release state does not match the validated candidate SHA." >&2
            exit 1
          fi
          git bundle verify "$state/release-state.bundle"
          git fetch "$state/release-state.bundle" HEAD --tags
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Release bundle HEAD does not match the validated candidate SHA." >&2
            exit 1
          fi
          git reset --hard "$EXPECTED_RELEASE_SHA"

      # --- Validation ---------------------------------------------------------

      # Step 9
      - name: 📦 Apply verified Linux outputs
        if: needs.linux-release-candidate.outputs.mode != 'none'
        run:
          smoo github-ci apply-outputs --source-sha "${{ needs.linux-release-candidate.outputs.release-sha }}" "${{
          runner.temp }}/publish-artifacts/publish-release-outputs-${{ github.run_id }}" "${{ runner.temp
          }}/publish-artifacts/publish-linux-outputs-${{ github.run_id }}"

      # Step 10
      - name: 🧾 Select prebuilt platform outputs
        # A platform leg the plan skipped left no artifact, and that is the
        # expected shape; a leg the plan asked for must have delivered one.
        id: platform-outputs
        run: |
          set -euo pipefail
          dirs=""
          for dir in "${{ runner.temp }}/publish-artifacts/publish-macos-arm64-outputs-${{ github.run_id }}/current" "${{ runner.temp }}/publish-artifacts/publish-macos-x64-outputs-${{ github.run_id }}/current"; do
            if [ -d "$dir" ]; then
              # runner.temp carries no spaces; the publish step splits this on them.
              dirs="$dirs $dir"
            elif [ "${{ needs.macos-platform.outputs.platform_work }}" = "true" ]; then
              echo "Platform outputs the plan asked for are missing: $dir" >&2
              exit 1
            fi
          done
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      # Step 11
      - name: 🍎 Apply verified macOS outputs
        if: needs.linux-release-candidate.outputs.mode != 'none' && steps.platform-outputs.outputs.dirs != ''
        run: smoo github-ci apply-outputs --source-sha "${{ github.sha }}" ${{ steps.platform-outputs.outputs.dirs }}

      # --- Release ------------------------------------------------------------

      # Step 12
      - name: 🏷️ Tag release
        # Ordered before the publish below so an interrupted release stays
        # detectable by the repair step at the top of this job on a later run.
        run: smoo release tag --dry-run "${{ inputs.dry_run }}"

      # Step 13
      - name: 📦 Publish release (${{ needs.linux-release-candidate.outputs.mode }})
        # Pack verified outputs; --prebuilt refuses missing artifacts rather than rebuilding.
        # Public npm packages use trusted publishing/OIDC after local bootstrap.
        run:
          smoo release publish --prebuilt "${{ runner.temp }}/publish-artifacts/publish-release-outputs-${{
          github.run_id }}" "${{ runner.temp }}/publish-artifacts/publish-linux-outputs-${{ github.run_id }}" ${{
          steps.platform-outputs.outputs.dirs }} --bump "${{ inputs.bump }}" --dry-run "${{ inputs.dry_run }}"

      # --- Cleanup ------------------------------------------------------------

      # Step 14
      - name: 🧹 Cleanup and cache Nix/devenv
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          nix-cache-hit: ${{ steps.setup.outputs.nix-cache-hit }}
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}
