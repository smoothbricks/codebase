name: StateBus browser tests
on:
  pull_request:
    paths:
      - 'packages/statebus-*/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/statebus-browser.yml'
      - '.github/actions/setup-devenv/**'
  push:
    branches: [main]
    paths:
      - 'packages/statebus-*/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/statebus-browser.yml'
      - '.github/actions/setup-devenv/**'
permissions:
  contents: read
concurrency:
  group: statebus-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-devenv
      - name: Verify frozen dependencies
        run: bun install --frozen-lockfile
      - name: Lint and typecheck browser contracts
        run: nx run statebus-navigation-browser:lint
      - name: Browser primitive and real React-StateBus integration
        run: nx run statebus-navigation-browser:test-browser --output-style=static
