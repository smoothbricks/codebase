name: StateBus package contracts
on:
  pull_request:
    paths:
      - 'packages/statebus-*/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/statebus-packages.yml'
      - '.github/actions/setup-devenv/**'
      - '.github/actions/cache-node-modules/**'
      - 'tooling/direnv/**'
      - 'packages/nx-plugin/managed/raw/tooling/direnv/**'
  push:
    branches: [main]
    paths:
      - 'packages/statebus-*/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/statebus-packages.yml'
      - '.github/actions/setup-devenv/**'
      - '.github/actions/cache-node-modules/**'
      - 'tooling/direnv/**'
      - 'packages/nx-plugin/managed/raw/tooling/direnv/**'
permissions:
  contents: read
concurrency:
  group: statebus-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-devenv
      - name: Verify frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build the packed packages
        run:
          nx run-many -t build -p
          statebus-core,statebus-react,statebus-data-loader,statebus-tanstack-query,statebus-navigation-core,statebus-navigation-browser,lmao,arrow-builder,validation
          --output-style=static
      - name: Verify actual packed consumers against a fresh registry graph
        working-directory: packages/statebus-core
        run: bun scripts/verify-packages.mjs --fresh
      - name: Record exact-interest phase diagnostics in both engine orderings
        env:
          STATEBUS_BENCH_COMMIT: ${{ github.sha }}
        run: |
          for order in baseline-first candidate-first; do
            STATEBUS_BENCH_ORDER="$order" nx run statebus-core:bench-exact-interest --output-style=static
            STATEBUS_BENCH_ORDER="$order" nx run statebus-core:bench-exact-interest:v8 --output-style=static
          done
      - name: Record tracked source and revision for reproducible verification
        if: always()
        shell: bash
        run: |
          mkdir -p .cache/statebus-packages
          git archive HEAD | gzip > .cache/statebus-packages/source.tar.gz
          git rev-parse HEAD > .cache/statebus-packages/revision.txt
          if [ -d packages/statebus-core/.cache/benchmarks ]; then
            cp packages/statebus-core/.cache/benchmarks/exact-interest-*.json .cache/statebus-packages/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: statebus-package-contracts
          path: .cache/statebus-packages/*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup and cache Nix/devenv
        if: always()
        uses: ./.github/actions/save-nix-devenv
        with:
          devenv-cache-hit: ${{ steps.setup.outputs.devenv-cache-hit }}
