name: StateBus PR23 validation sources
on:
  push:
    branches: [feat/statebus-loader-navigation]
    paths: [.github/workflows/statebus-pr23-inputs.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked inputs only
        run: |
          mkdir -p "$RUNNER_TEMP/statebus-pr23"
          git archive HEAD | gzip > "$RUNNER_TEMP/statebus-pr23/head.tar.gz"
          git archive origin/main | gzip > "$RUNNER_TEMP/statebus-pr23/main.tar.gz"
          git rev-parse HEAD origin/main > "$RUNNER_TEMP/statebus-pr23/refs.txt"
          git diff origin/main HEAD -- packages/statebus-core packages/statebus-react > "$RUNNER_TEMP/statebus-pr23/base.diff"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-pr23-sources
          path: ${{ runner.temp }}/statebus-pr23/*
          retention-days: 1
          if-no-files-found: error
