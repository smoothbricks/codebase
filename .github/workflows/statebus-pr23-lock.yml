# Temporary lock generation/validation. Only bun.lock is written; removed before review.
name: StateBus PR23 lock inputs
on:
  push:
    branches: [feat/statebus-loader-navigation]
    paths: [.github/workflows/statebus-pr23-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'smoothbricks/codebase' && github.ref_name == 'feat/statebus-loader-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Generate and verify the actual dependency lock
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile --ignore-scripts
          mkdir -p "$RUNNER_TEMP/pr23-lock"
          cp bun.lock "$RUNNER_TEMP/pr23-lock/bun.lock"
          git archive HEAD | gzip > "$RUNNER_TEMP/pr23-lock/source.tar.gz"
          git diff -- bun.lock > "$RUNNER_TEMP/pr23-lock/lock.diff"
          git rev-parse HEAD > "$RUNNER_TEMP/pr23-lock/revision.txt"
          cd "$RUNNER_TEMP/pr23-lock" && sha256sum bun.lock source.tar.gz > SHA256SUMS
      - name: Commit only the generated lock if branch has not advanced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          head = get(f'repos/{repo}/git/ref/heads/{branch}')['object']['sha']
          if head != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch advanced; do not overwrite a newer dependency graph.')
          if not subprocess.check_output(['git', 'diff', '--', 'bun.lock']):
              print('Lock is unchanged.')
          else:
              source = get(f'repos/{repo}/contents/bun.lock?ref={head}')
              body = {'message': 'build(statebus): record verified Bun resolution for browser navigation',
                      'branch': branch, 'sha': source['sha'],
                      'content': base64.b64encode(pathlib.Path('bun.lock').read_bytes()).decode()}
              response = subprocess.check_output(['gh', 'api', '--method', 'PUT',
                  f'repos/{repo}/contents/bun.lock', '--input', '-'], input=json.dumps(body).encode())
              print('Committed generated lock:', json.loads(response)['commit']['sha'])
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-pr23-lock-inputs
          path: ${{ runner.temp }}/pr23-lock/*
          retention-days: 1
          if-no-files-found: error
