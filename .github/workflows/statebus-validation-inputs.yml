# Temporary validation transport, removed after retrieval. Only tracked source,
# installed package directories, and public Bun/Node executables are archived.
# No runner credentials, environment files, .git, or home directories.
name: StateBus validation inputs

on:
  pull_request:
    paths:
      - .github/workflows/statebus-validation-inputs.yml

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'smoothbricks/codebase' && github.event.pull_request.head.ref == 'fix/statebus-dispatch-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Install the checked-in dependency graph
        run: bun install --frozen-lockfile
      - name: Archive explicit validation inputs
        run: |
          mkdir -p "$RUNNER_TEMP/statebus-inputs/base" "$RUNNER_TEMP/statebus-tools/bin"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/statebus-inputs/base/source.tar.gz"
          find . -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/node-module-paths"
          tar --null -T "$RUNNER_TEMP/node-module-paths" -czf "$RUNNER_TEMP/statebus-inputs/node-modules.tar.gz"
          (cd "$RUNNER_TEMP/statebus-inputs" && sha256sum node-modules.tar.gz > base/node-modules.sha256)
          split -b 250M -d "$RUNNER_TEMP/statebus-inputs/node-modules.tar.gz" "$RUNNER_TEMP/statebus-inputs/modules-"
          rm "$RUNNER_TEMP/statebus-inputs/node-modules.tar.gz"
          cp "$(command -v bun)" "$RUNNER_TEMP/statebus-tools/bin/bun"
          cp "$(command -v node)" "$RUNNER_TEMP/statebus-tools/bin/node"
          tar -C "$RUNNER_TEMP/statebus-tools" -czf "$RUNNER_TEMP/statebus-inputs/base/toolchain.tar.gz" bin
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-validation-base
          path: ${{ runner.temp }}/statebus-inputs/base/*
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-validation-modules-00
          path: ${{ runner.temp }}/statebus-inputs/modules-00
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-validation-modules-01
          path: ${{ runner.temp }}/statebus-inputs/modules-01
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-validation-modules-02
          path: ${{ runner.temp }}/statebus-inputs/modules-02
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-validation-modules-03
          path: ${{ runner.temp }}/statebus-inputs/modules-03
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-validation-modules-04
          path: ${{ runner.temp }}/statebus-inputs/modules-04
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-validation-modules-05
          path: ${{ runner.temp }}/statebus-inputs/modules-05
          retention-days: 1
          if-no-files-found: ignore
