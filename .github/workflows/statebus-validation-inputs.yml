# Temporary, branch-scoped lockfile regeneration. Removed after the generated lock is reviewed.
# Only bun.lock may be committed; the non-force push refuses a concurrently advanced branch.
name: StateBus lockfile generation

on:
  pull_request:
    paths:
      - .github/workflows/statebus-validation-inputs.yml

permissions:
  contents: read

jobs:
  lockfile:
    if: >-
      github.repository == 'smoothbricks/codebase' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/statebus-loader-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Generate the dependency lock using the repository package manager
        run: bun install --lockfile-only --ignore-scripts
      - name: Verify frozen dependency resolution
        run: bun install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Commit only the generated lockfile to the requested working branch
        run: |
          test -z "$(git diff --name-only -- . ':!bun.lock')"
          test -z "$(git ls-files --others --exclude-standard)"
          if git diff --quiet -- bun.lock; then exit 0; fi
          git add -- bun.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(deps): generate StateBus adapter workspace lockfile'
          git push origin HEAD:refs/heads/feat/statebus-loader-navigation
