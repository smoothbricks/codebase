# Temporary compiler bootstrap transport, removed before release. This exports
# public compiler/module inputs and generated tooling, never runner credentials.
name: StateBus validation inputs

on:
  pull_request:
    paths:
      - .github/workflows/statebus-validation-inputs.yml

permissions:
  contents: read

jobs:
  compiler:
    if: github.repository == 'smoothbricks/codebase' && github.event.pull_request.head.ref == 'fix/statebus-dispatch-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Install dependencies and prepare compiler inputs
        run: |
          sed -i 's/globalStore = true/globalStore = false/' bunfig.toml
          bun install --frozen-lockfile --backend copyfile
          ln -sfn ../typescript@6.0.3/node_modules/typescript node_modules/.bun/node_modules/typescript
          export PATH="$PWD/node_modules/.bin:$PATH"
          export GOMODCACHE="$RUNNER_TEMP/statebus-gomod"
          export TTSC_GO_CACHE_DIR="$RUNNER_TEMP/statebus-gobuild"
          export TTSC_CACHE_DIR="$RUNNER_TEMP/statebus-ttsc"
          export TTSC_TSGO_BINARY="$PWD/node_modules/@typescript/native/bin/tsc"
          ttsc -p packages/nx-plugin/tsconfig.lib.json --emit
          bun packages/lmao-ttsc/scripts/gen-go-work.mjs
          (cd packages/lmao-ttsc/plugin && go build -o "$RUNNER_TEMP/statebus-lmao-host" ./host)
          mkdir -p "$RUNNER_TEMP/statebus-compiler"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/statebus-compiler/go-modules.tar.gz" statebus-gomod
          tar -C "$(go env GOROOT)" -czf "$RUNNER_TEMP/statebus-compiler/go-toolchain.tar.gz" .
          tar -czf "$RUNNER_TEMP/statebus-compiler/generated-tools.tar.gz" packages/nx-plugin/dist
          (cd "$RUNNER_TEMP/statebus-compiler" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: statebus-native-compiler-inputs
          path: ${{ runner.temp }}/statebus-compiler/*
          retention-days: 1
          if-no-files-found: error
