[workspace]
resolver = "3"
members = [
  "packages/columine/crates/*",
  "packages/bitmosaic/crates/*",
  "packages/cowshed/crates/*",
  "packages/lmao/crates/*",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false
repository = "https://github.com/smoothbricks/smoothbricks"

[workspace.dependencies]
columine-types = { path = "packages/columine/crates/columine-types" }
columine-vm = { path = "packages/columine/crates/columine-vm" }
cowshed-core = { path = "packages/cowshed/crates/cowshed-core" }
lmao-core = { path = "packages/lmao/crates/lmao-core" }
lmao-arena = { path = "packages/lmao/crates/lmao-arena" }
# bitmosaic is this repository's public compressed bitmap package: the
# ladder-selected container bitmap whose native image is the BITMAP slot
# codec. It is a plain in-repo workspace member, so the dependency is a
# normal relative path.
bitmosaic = { path = "packages/bitmosaic/crates/bitmosaic" }
arrow-array = { version = "56", default-features = false }
arrow-buffer = { version = "56", default-features = false }
arrow-ipc = { version = "56", default-features = false }
arrow-schema = { version = "56", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "error-context", "usage"] }
criterion = { version = "0.5", default-features = false }
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-build = "2"
napi-derive = "2"
proptest = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
# `serde` is load-bearing for every user, not a convenience: in toml 1.x `toml::from_str`,
# `toml::Table` and `toml::Value` are all behind `#[cfg(feature = "serde")]`. cowshed-core
# deserializes `.cowshed.toml` through `from_str`; cowshed-cli's
# capabilities/sccache/client_config.rs reads sccache's config through `Table` and `Value`.
# Dropping the feature does not trim a feature, it deletes those items — `cargo check -p
# cowshed-cli` then fails with "cannot find type `Table` in crate `toml`". Verify with a build,
# not by reading usage, before touching this line.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

# `smoo monorepo validate` requires the dev and debugging profiles below at
# every Cargo workspace root.
#
# dev is the edit-compile-test loop and stays incremental. Workspace crates get
# file:line (backtraces, profilers) without full DWARF, and debuginfo stays in
# the object files instead of being relinked into every binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Dependencies carry no debuginfo: measured -57% target bytes at flat CPU.
[profile.dev.package."*"]
debug = 0

# Same debug level as package."*": a crate that both build scripts or proc
# macros and ordinary code use is one unit only while both see the same level;
# otherwise Cargo compiles it, and everything above it, twice.
[profile.dev.build-override]
debug = 0

# To debug: `cargo build --profile debugging` or `cargo test --profile
# debugging`. It is dev with full DWARF everywhere, built into
# target/debugging, so it never invalidates the dev units or their cache.
[profile.debugging]
inherits = "dev"
debug = 2

# A custom profile inherits dev's package."*" debug = 0; without this the
# dependencies stay opaque to the debugger.
[profile.debugging.package."*"]
debug = 2

# Same level as package."*", for the same one-unit reason as dev.
[profile.debugging.build-override]
debug = 2

[profile.release]
lto = true
codegen-units = 1

# The shipped columine wasm, and nothing else, builds with this profile: it
# compiles only wasm32 units, so it duplicates no dev or release unit. Size
# wins everywhere except the VM and parser hot paths.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.wasm-release.package.columine-vm]
opt-level = 3

[profile.wasm-release.package.columine-parsing]
opt-level = 3
