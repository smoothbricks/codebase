[workspace]
resolver = "3"
members = [
  "packages/columine/crates/*",
  "packages/cowshed/crates/*",
  "packages/lmao/crates/*",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false
repository = "https://github.com/smoothbricks/smoothbricks"

[workspace.dependencies]
columine-types = { path = "packages/columine/crates/columine-types" }
columine-vm = { path = "packages/columine/crates/columine-vm" }
cowshed-core = { path = "packages/cowshed/crates/cowshed-core" }
lmao-core = { path = "packages/lmao/crates/lmao-core" }
lmao-arena = { path = "packages/lmao/crates/lmao-arena" }
# Crates from the minigraf fork (https://github.com/axe-scale/minigraf):
# axroar, the ladder-selected compressed bitmap whose AXR1 string is the
# BITMAP slot codec and the event processor's ordinal seen-set carrier, and
# ptmcart-core, whose `art::ArtMap` is the event processor's byte-keyed
# seen-set. Absolute paths, deliberately, until the crates are published:
# cargo identifies a path package by the path as spelled, and a workspace
# that compiles this one together with other minigraf crates (through a
# symlink beside its own checkout) only gets ONE copy of each crate when
# every manifest spells the identical absolute path — a relative path
# resolved through that symlink would name a second package of the same
# name and split the types. A git dependency needs the fork pushed at the
# rev these crates compile against; when it is, the dependency becomes
# `git = "https://github.com/axe-scale/minigraf.git", rev = "…"` and a
# consuming workspace unifies it with its own checkout through `[patch]`.
axroar = { path = "/Users/danny/Dev/_fork/minigraf/axroar" }
ptmcart-core = { path = "/Users/danny/Dev/_fork/minigraf/ptmcart-core" }
arrow-array = { version = "56", default-features = false }
arrow-buffer = { version = "56", default-features = false }
arrow-ipc = { version = "56", default-features = false }
arrow-schema = { version = "56", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "error-context", "usage"] }
criterion = { version = "0.5", default-features = false }
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-build = "2"
napi-derive = "2"
proptest = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }

[profile.release]
lto = true
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.wasm-release.package.columine-vm]
opt-level = 3

[profile.wasm-release.package.columine-parsing]
opt-level = 3

[profile.test]
incremental = false
debug = 0
