[package]
name = "bitmosaic"
version = "0.1.0"
edition = "2024"
description = "Ladder-selected compressed bitmap: cone/stride/array/summary-steered-word containers with fused bitwise ops, rank/select, and closed-form stride intersection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smoothbricks/codebase"
publish = ["crates-io"]

[[package.metadata.wiring.external]]
item = "as_str"
consumer = "private"
why = "an embedder reports the bitmap admission rule beside its image-relative offset without reparsing the image"

[[package.metadata.wiring.external]]
item = "BitmapView"
consumer = "private"
why = "a storing format whose field is always the Bitmap root reads it with no dispatch on the control byte"

[[package.metadata.wiring.external]]
item = "open_admitted"
consumer = "private"
why = "a kernel reopens a Bitmap its certifying pass admitted, with the extent checked and the last-byte rule not repeated"

[[package.metadata.wiring.external]]
item = "extent"
consumer = "private"
why = "a Bitmap is embedded with no outer length, so its reader finds the next field by the image's own extent"

[[package.metadata.wiring.external]]
item = "bytes"
consumer = "private"
why = "a certifying pass compares a frame's bitmap bytes with what its descriptor allows"

[[package.metadata.wiring.external]]
item = "word"
consumer = "private"
why = "a column's place in a frame is the population count of the frame's words under the descriptor's own masks"

[[package.metadata.wiring.external]]
item = "BitmapIter"
consumer = "private"
why = "a certifying pass walks a frame's positions and returns its refusal from inside the walk"

[[package.metadata.wiring.external]]
item = "bitmap_len"
consumer = "private"
why = "a writer that holds no slice of positions reserves a frame's bytes from its greatest position"

[[package.metadata.wiring.external]]
item = "bitmap_set"
consumer = "private"
why = "a writer names a frame's columns one at a time while it lays their buffers into the same output"

[[package.metadata.wiring.external]]
item = "bitmap_seal"
consumer = "private"
why = "a writer closes a frame once its last column is named"

[[package.metadata.wiring.external]]
item = "Image"
consumer = "private"
why = "a consumer that holds a set-typed value tells its format by the first byte and refuses by name what this version does not read"

[[package.metadata.wiring.external]]
item = "promote"
consumer = "private"
why = "a consumer hydrates a sealed Format 2 maplet back into a live mutable Maplet on first write"

[[package.metadata.wiring.external]]
item = "is_multi_value"
consumer = "private"
why = "a caller distinguishes unique-key and multi-value sealed maplets before routing lookups"

[[package.metadata.wiring.external]]
item = "insert_bounded"
consumer = "private"
why = "a router folds repeated keys into a maplet with O(1) per-bucket saturation and zero spill growth"

[[package.metadata.wiring.external]]
item = "for_each_match_bounded"
consumer = "private"
why = "a router probes candidate values with O(1) per-bucket saturation fallback and zero global cold gate"

[[package.metadata.wiring.external]]
item = "is_key_saturated"
consumer = "private"
why = "an incidence filter checks whether a key's home bucket is saturated before probing inline slots"

[dependencies]

[features]
# Skew-arm instrument: the balanced-arm force switch and the position
# counters the A/B harness reads, and the differential oracle steps
# (`bitmosaic::oracle`) the fuzz targets drive on every forced arm. Absent
# from a shipped build — a counter compiled into a kernel is a cost on the
# very path it claims to witness, and the arm switch would put a load and a
# branch in front of a chooser that is otherwise pure arithmetic on
# cardinalities already in register.
bench-internals = []
# Opt OUT of the wasm32 SIMD128 hand kernel (`words_and_count`). It is
# enabled per function with `#[target_feature(enable = "simd128")]`, so the
# module stays scalar and only the kernel vectorises; simd128 has been
# universal in shipping wasm engines since 2021, so the default is on. Set
# this only when targeting an engine that predates the SIMD proposal — the
# module would otherwise fail validation there. A downstream crate that
# exposes a feature of the same name forwards it here, under the same contract.
wasm-scalar-portable = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
roaring = "0.10"
serde_json = { workspace = true }

[[bench]]
name = "ops"
harness = false

[[bench]]
name = "patch"
harness = false

[[example]]
name = "g261_skew_census"
required-features = ["bench-internals"]

[[example]]
name = "g378_words_refuter"
required-features = ["bench-internals"]

[[example]]
name = "patch_sequence"
required-features = ["bench-internals"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
