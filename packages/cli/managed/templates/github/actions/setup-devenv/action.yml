name: Setup Nix/devenv
description: >
  Build the SmoothBricks devenv shell after checkout. Restores the small devenv/direnv actions/cache segment on every
  runner (eval SQLite + shell scripts). On GARM/NixOS (NIX_REMOTE=daemon + /var/cache/ci) skips Nix install and the
  large store NAR (host store). On ubuntu/macOS installs Nix and restores the NAR/profile cache.

outputs:
  nix-cache-hit:
    description: Whether the Nix profile/store cache restored from the exact primary key.
    value: ${{ steps.nix-cache.outputs.cache-hit || 'false' }}
  devenv-cache-hit:
    description: Whether the devenv/direnv cache restored from the exact primary key.
    value: ${{ steps.devenv-cache.outputs.cache-hit || 'false' }}
  host-runner:
    description: Whether this job is on a host-nix runner (GARM) with shared store/caches.
    value: ${{ steps.runner-kind.outputs.host }}

runs:
  using: composite
  steps:
    # This action is intentionally post-checkout only. Repo-local actions do not
    # exist before actions/checkout has populated the working tree.

    # Runner image/profile owns paths (NIX_REMOTE, /var/cache/ci/*). Detect here
    # so every workflow can `uses: setup-devenv` without forking step graphs.
    - name: 🔎 Runner kind
      id: runner-kind
      shell: bash
      run: |
        if [ "${NIX_REMOTE:-}" = daemon ] && [ -d /var/cache/ci ]; then
          echo "host=true" >> "$GITHUB_OUTPUT"
          echo "host-nix runner (shared store + /var/cache/ci)"
        else
          echo "host=false" >> "$GITHUB_OUTPUT"
          echo "ephemeral runner (install Nix + GH caches)"
        fi

    # Nx names its cache metadata DB after the machine identity
    # (.nx/workspace-data/<machine-id>-v3.db) and refuses artifacts written by a
    # different machine. Each runner instance is a fresh clone that generates its
    # own id on first boot, so a restored DB is never the file Nx opens: measured,
    # every artifact came back unrecognized and the transfer was wasted. GitHub's
    # hosted images ship one baked id, which is why the same wiring works there.
    #
    # Pin the id, then keep the cache on the shared mutable bind instead of
    # shipping it through the Actions cache. One host is then one cache with one
    # identity, which is the only arrangement Nx trusts. Artifacts AND metadata
    # must move together: the DB alone is where "Nx recognizes this" lives.
    #
    # /etc/machine-id is a plain writable file here, not a mount point. The
    # durable home for this is the runner image; doing it per job keeps the fix
    # in one managed place until then.
    - name: 🧠 Pin the machine id and locate the Nx cache
      if: steps.runner-kind.outputs.host == 'true'
      shell: bash
      env:
        # Any valid 32-char lowercase hex; only its stability across instances
        # matters. Shared fleet-wide on purpose — see the cache trust model in
        # the CI workflow's save step.
        FLEET_MACHINE_ID: 5cbb1f9a4d2e4f0f8b6a3c7d9e150246
        NX_CACHE_REPO: ${{ github.repository }}
        NX_CACHE_LANE: ${{ github.workflow }}
      run: |
        printf '%s\n' "$FLEET_MACHINE_ID" | sudo tee /etc/machine-id >/dev/null
        # Scoped per workflow, and it has to be. workspace-data is not a cache:
        # it holds project-graph.json, file-map.json and nx_files for ONE
        # checkout. It cannot be split from the artifacts either -- Nx rejects
        # cache artifacts it has no DB row for ("Unrecognized Cache Artifacts"),
        # and that DB lives in workspace-data. Since CI and Publish sit in
        # different concurrency groups they run simultaneously on one host, so a
        # repository-wide tree let one workflow rewrite the other's graph state
        # mid-read; that is what failed a release with a bare non-zero
        # `nx show project`. Per lane they stay warm and never overlap.
        lane=$(printf '%s' "$NX_CACHE_LANE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
        NX_CACHE_ROOT="/var/cache/ci/nx/$NX_CACHE_REPO/${lane:-default}"
        mkdir -p "$NX_CACHE_ROOT/cache" "$NX_CACHE_ROOT/workspace-data"
        {
          echo "NX_CACHE_DIRECTORY=$NX_CACHE_ROOT/cache"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$NX_CACHE_ROOT/workspace-data"
          # Nx's own eviction. It drops artifacts and their DB rows together, so
          # never age this tree out with tmpfiles: deleting artifacts alone is a
          # silent miss, but deleting the DB orphans every artifact.
          echo "NX_MAX_CACHE_SIZE=20GB"
        } >> "$GITHUB_ENV"
        echo "machine id : $(cat /etc/machine-id)"
        echo "nx cache   : $NX_CACHE_ROOT"

    # Devenv segment (own key): tooling/direnv/.devenv + .direnv — includes
    # nix-eval-cache.db. Independent of the nix NAR; restore on host and ephemeral
    # whether or not the store cache hit. Missing store paths are fine: devenv
    # verifies shell drv/out exist on eval-cache hit and invalidates + re-evals
    # / realizes when GC removed them. Packages still come from host store, NAR,
    # or Cachix — this blob only skips evaluation.
    - name: 🧊 Cache devenv and direnv
      id: devenv-cache
      uses: ./.github/actions/cache-nix-devenv
      with:
        segment: devenv

    - name: ❄️ Install Nix
      if: steps.runner-kind.outputs.host != 'true'
      uses: DeterminateSystems/determinate-nix-action@v3

    - name: 🧊 Cache Nix profiles and store NAR
      id: nix-cache
      if: steps.runner-kind.outputs.host != 'true'
      uses: ./.github/actions/cache-nix-devenv
      with:
        segment: nix

    - name: ♻️ Restore Nix store from NAR
      if: steps.runner-kind.outputs.host != 'true'
      shell: bash
      working-directory: tooling/direnv
      run: ./github-actions-bootstrap.sh restore-store

    - name: ⚡ Enable Cachix
      if: steps.runner-kind.outputs.host != 'true'
      uses: cachix/cachix-action@v17
      with:
        name: devenv

    - name: 🧰 Install devenv
      shell: bash
      working-directory: tooling/direnv
      run: ./github-actions-bootstrap.sh install-devenv

    # node_modules + ttsc plugin binaries: GH Actions cache on ephemeral runners.
    # Host runners keep those under the /var/cache/ci bind (bun / ttsc env).
    - name: 📦 Cache node_modules
      if: steps.runner-kind.outputs.host != 'true'
      uses: ./.github/actions/cache-node-modules

    - name: 🧊 Cache ttsc plugins
      if: steps.runner-kind.outputs.host != 'true'
      uses: ./.github/actions/cache-ttsc-plugins

    - name: 🐚 Build devenv shell
      shell: bash
      working-directory: tooling/direnv
      run: ./github-actions-bootstrap.sh build-shell
