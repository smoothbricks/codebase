[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false
repository = "https://github.com/smoothbricks/smoothbricks"

[workspace.dependencies]
columine-types = { path = "crates/columine-types" }
columine-vm = { path = "crates/columine-vm" }
# Portable RoaringFormatSpec (same spec rawr implements — cookies 12346/12347).
roaring = { version = "0.11", default-features = false, features = ["std"] }
proptest = "1"
arrow-array = { version = "56", default-features = false }
arrow-ipc = { version = "56", default-features = false }
arrow-schema = { version = "56", default-features = false }

[profile.release]
lto = true
codegen-units = 1

# Keeps wasm32 exports in the same size class as Zig's ReleaseSmall build.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.wasm-release.package.columine-vm]
opt-level = 3

# The parsing hot loops (json scanner/extractor) benefit from real inlining
# the same way the VM dispatch does; measured in tools/simd-ingest-bench.ts.
[profile.wasm-release.package.columine-parsing]
opt-level = 3

# The shared lane. `incremental = false` is what makes these units cacheable at
# all — cargo marks incremental compilations non-cacheable, and the `test`
# profile inherits `dev`, which is incremental — and `debug = 0` is what keeps a
# cached artifact correct in a workspace that did not build it: a cacheable
# profile carrying debuginfo hands the hitting checkout the producing checkout's
# absolute source paths. Matches packages/cowshed.
[profile.test]
incremental = false
debug = 0
