[package]
name = "columine-event-processor"
description = "Public event-processor parse plane: semantic validation, JSON/MessagePack extraction, DynamicColumns, and Arrow IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# An embedder injects its value cell writer and owns its stream dictionary
# (specs/columine/10-physical-vocabulary.md §5, §7).
[[package.metadata.wiring.external]]
item = "new_with_cells"
consumer = "private"
why = "an embedder creates a processor that stores its own encoding in the value cells"

[[package.metadata.wiring.external]]
item = "category_mark"
consumer = "private"
why = "the owner of a stream dictionary truncates it to a batch's mark when it drops the batch"
[dependencies]
columine-arrow = { path = "../columine-arrow" }
columine-parsing = { path = "../columine-parsing" }
columine-types = { path = "../columine-types" }

[dev-dependencies]
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }

# Event processing by input format and batch size.
# Run: `cargo bench -p columine-event-processor --bench batch_scale`
[[bench]]
name = "batch_scale"
harness = false
