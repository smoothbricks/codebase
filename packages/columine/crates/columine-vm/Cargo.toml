[package]
name = "columine-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# The change feed's pass surface is driven by the consumer's RETE layer, which
# owns the tracked mask, the pass boundaries and derived-fact recording
# (specs/columine/07-change-feed.md §1).
[[package.metadata.wiring.external]]
item = "feed_bind"
consumer = "rete"
path = "crates/rete/src/pass.rs"

[[package.metadata.wiring.external]]
item = "feed_begin_pass"
consumer = "rete"
path = "crates/rete/src/pass.rs"

[[package.metadata.wiring.external]]
item = "feed_end_pass"
consumer = "rete"
path = "crates/rete/src/pass.rs"

[[package.metadata.wiring.external]]
item = "feed_record_fact"
consumer = "rete"
path = "crates/rete/src/derived_facts.rs"

[[package.metadata.wiring.external]]
item = "feed_work"
consumer = "rete"
path = "crates/rete/src/pass.rs"

# The rule engine seeds keyed evaluation from the pass's entries, their chains and the
# overflowed sources (specs/columine/07-change-feed.md §2, §5).
[[package.metadata.wiring.external]]
item = "feed"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "entries"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "chain"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "overflow"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "overflowed"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "source"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "key"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "change"
consumer = "rete"
path = "crates/rete/src/seed.rs"

[[package.metadata.wiring.external]]
item = "prev"
consumer = "rete"
path = "crates/rete/src/seed.rs"

# A host's bitmap export re-enters through the VM's own hooks, so an armed feed sees the
# import (specs/columine/07-change-feed.md §4).
[[package.metadata.wiring.external]]
item = "bitmap_import"
consumer = "superset-wasm"
path = "crates/superset-wasm/src/lib.rs"

[lib]
path = "src/lib.rs"

# A private consumer calls `Vm::undo_records` (AGENTS.md rule 7, "Done").
[[package.metadata.wiring.external]]
item = "undo_records"
consumer = "private"
why = "a host keeps a fact derived from the state image current from each pass's journal records instead of rescanning the image"



[dependencies]
bitmosaic = { workspace = true }
columine-types = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# tests/opcode_audit.rs harvests the frozen ABI snapshot and the dispatch
# source; the fixture strings must not enter the shipped artifact.
columine-types = { workspace = true, features = ["audit"] }

[[bench]]
name = "bitmap_cells"
harness = false

# The live row-expression cell read per row.
# Run: `cargo bench -p columine-vm --bench row_exprs`
[[bench]]
name = "row_exprs"
harness = false

# Batch capacity admission: each tier's cost, and how often each tier decides
# in a near-capacity stream.
# Run: `cargo bench -p columine-vm --bench capacity_admission`
[[bench]]
name = "capacity_admission"
harness = false

# Batch map upserts into four maps by batch size, journal off and on.
# Run: `cargo bench -p columine-vm --bench map_upsert_scale`
[[bench]]
name = "map_upsert_scale"
harness = false
