[package]
name = "columine-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
axroar = { workspace = true }
columine-types = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# tests/opcode_audit.rs harvests the frozen ABI snapshot and the dispatch
# source; the fixture strings must not enter the shipped artifact.
columine-types = { workspace = true, features = ["audit"] }

[[bench]]
name = "bitmap_cells"
harness = false
