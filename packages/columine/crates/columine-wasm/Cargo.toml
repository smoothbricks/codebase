[package]
name = "columine-wasm"
description = "columine.wasm: the generic reducer-VM export surface (no RETE) shipped by the @smoothbricks/columine npm package"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
columine-types = { workspace = true }
columine-vm = { workspace = true }

[dev-dependencies]
# The export audit reads the wasm export section and the frozen ABI table.
columine-types = { workspace = true, features = ["audit"] }
