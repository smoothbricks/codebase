[workspace]
resolver = "3"
members = [
  "crates/cowshed-core",
  "crates/cowshed-cli",
  "crates/cowshed-gateway",
  "crates/cowshed-napi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
cowshed-core = { path = "crates/cowshed-core" }
anyhow = "1"
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"
napi-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Spelled out rather than `full`, which additionally enables `rt-multi-thread` and `parking_lot`.
# Every runtime this workspace builds is current-thread — `#[tokio::main(flavor =
# "current_thread")]` in cowshed-cli, `Builder::new_current_thread` in cowshed-napi and the core
# test harnesses, and `#[tokio::test]`, which is current-thread by default — so the work-stealing
# scheduler is code nothing here reaches, and `parking_lot` only swaps tokio's internal mutex.
# Naming what is used means a future `spawn` that genuinely needs a multi-thread scheduler fails
# to compile instead of silently finding one.
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
clap = { version = "4", default-features = false, features = ["std", "error-context", "usage"] }

# The full lane links 27 test executables from a cold target directory. They do
# not consume debug symbols or incremental state, so emitting either only adds
# compile, link, and artifact-cache work.
[profile.test]
debug = 0
incremental = false