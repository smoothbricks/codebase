# Every child cowshed-apfs spawns is spawned under the fork lock, so no spawn in flight holds a
# socket or lease another thread is releasing (cowshed-os/src/fork_lock.rs).
disallowed-methods = [
  { path = "std::process::Command::spawn", reason = "spawn with cowshed_os::fork_lock::Spawn::spawn_locked" },
  { path = "std::process::Command::output", reason = "run with cowshed_os::fork_lock::Run::output_locked" },
  { path = "std::process::Command::status", reason = "run with cowshed_os::fork_lock::Run::status_locked" },
  { path = "tokio::process::Command::spawn", reason = "spawn with cowshed_os::fork_lock::Spawn::spawn_locked" },
  { path = "tokio::process::Command::output", reason = "run with cowshed_os::fork_lock::RunAsync::output_locked" },
  { path = "tokio::process::Command::status", reason = "run with cowshed_os::fork_lock::RunAsync::status_locked" },
]

# Every stderr line is one write: cowshed processes share one stderr file, and std's macros write
# a line in pieces that splice into other processes' lines (cowshed-os/src/stderr.rs).
disallowed-macros = [
  { path = "std::eprintln", reason = "write the line with cowshed_os::eprintln!, in one write" },
  { path = "std::eprint", reason = "write the text with cowshed_os::eprint!, in one write" },
]
