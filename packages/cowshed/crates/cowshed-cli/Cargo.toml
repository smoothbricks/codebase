[package]
name = "cowshed-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cowshed"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
cowshed-core.workspace = true
cowshed-gateway = { path = "../cowshed-gateway" }
clap.workspace = true

libc = "0.2"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# sccache's own config file is TOML, and `setup` has to read one it did not write without
# reordering or dropping a key its author set. Parsing is what makes the never-clobber decision
# honest; preservation is keys and byte-for-byte prefix — only a missing final newline is
# inserted — and only cowshed's appended block is ever rewritten.
#
# `serde` is load-bearing and is NOT about (de)serializing our own types, so enumerating call
# sites will mislead you: in toml 1.x the `toml::Table` and `toml::Value` types are themselves
# behind `#[cfg(feature = "serde")]`, and sccache_client_config.rs reads the config through
# both. Dropping the feature does not trim a feature, it deletes the types —
# `cargo check -p cowshed-cli` then fails with "cannot find type `Table` in crate `toml`".
# Verify with a build, not by reading usage, before touching this line.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
