[package]
name = "cowshed-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# One runner was the gate's tail: 487 tests, 1130 s of them in a few dozen command_dispatch
# directory-substrate cases (up to 170 s each), run on one token after the rest of the gate had
# finished (2026-10-22: 1225 s, sum of test times equal to the wall). Eight runners each take
# their own grant. Membership is nextest's test-name hash, except the slow tests
# .config/nextest-timings.json names, which the exception shards take by measured time.
[package.metadata.smoothbricks.test]
shards = 8

[[bin]]
name = "cowshed"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
cowshed-apfs = { path = "../cowshed-apfs" }
cowshed-os = { path = "../cowshed-os" }
cowshed-gateway-types = { path = "../cowshed-gateway-types" }
cowshed-core.workspace = true
cowshed-shell = { path = "../cowshed-shell" }
cowshed-gateway = { path = "../cowshed-gateway" }
clap.workspace = true

libc = "0.2"
# The gateway host's self-signed code-signing certificate (src/code_signing.rs).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
url = "2"
zeroize = "1"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# sccache's own config file is TOML, and `setup` has to read one it did not write without
# reordering or dropping a key its author set. Parsing is what makes the never-clobber decision
# honest; preservation is keys and byte-for-byte prefix — only a missing final newline is
# inserted — and only cowshed's appended block is ever rewritten. The workspace manifest says why
# its `serde` feature is load-bearing.
toml.workspace = true

[dev-dependencies]
# The expired-wait boundary test (src/run.rs) reads the Arrow segment it seals.
arrow-array = "56"
arrow-ipc = "56"
# The install and restart decisions (src/agent_cycle.rs) are property-tested.
proptest = "1"
# Paused time: a test lets a day pass while a foreground exec still waits for its job.
tokio = { workspace = true, features = ["test-util"] }
# The shared TempRoot fixture (cowshed-core/tests/support/temp_root.rs) names its directories.
uuid = { version = "1", features = ["v4"] }
