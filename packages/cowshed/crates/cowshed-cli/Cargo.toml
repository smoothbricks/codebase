[package]
name = "cowshed-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cowshed"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
cowshed-core.workspace = true
cowshed-shell = { path = "../cowshed-shell" }
cowshed-gateway = { path = "../cowshed-gateway" }
clap.workspace = true

libc = "0.2"
url = "2"
zeroize = "1"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# sccache's own config file is TOML, and `setup` has to read one it did not write without
# reordering or dropping a key its author set. Parsing is what makes the never-clobber decision
# honest; preservation is keys and byte-for-byte prefix — only a missing final newline is
# inserted — and only cowshed's appended block is ever rewritten. The workspace manifest says why
# its `serde` feature is load-bearing.
toml.workspace = true

[dev-dependencies]
# Paused time: a test lets a day pass while a foreground exec still waits for its job.
tokio = { workspace = true, features = ["test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
