[package]
name = "cowshed-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Earlier hosted-CI sizing measured a 3-core macOS runner ~1.85x slower, with three Nx tasks
# competing for its cores and ~13s of archive extraction per batch. Three shards ran out
# 101.9s in with 35 tests left; five were chosen for that workload.
# The same full test set runs in bounded hash partitions, never serialized and with no raised
# timeout. Five shards later exhausted the 120s execution bound on a loaded local host:
# first at 258/264 tests after a 139.8s CPU-token wait outside that bound, then at 212/264.
# Eight reduce each batch's serial work; membership stays derived from nextest's test-name hash.
[package.metadata.smoothbricks.test]
shards = 8

[[bin]]
name = "apfs-benchmark"
path = "src/bin/apfs_benchmark.rs"
test = false
bench = false

[dependencies]
arrow-array = "56"
arrow-buffer = "56"
arrow-ipc = "56"
arrow-schema = "56"
base64 = "0.22"
blake3 = "1"
async-trait = "0.1"
bytes = "1"
# The control-plane data model only. Reconciling the gateway's session table against host
# inventory is a pure function of these values, so the controller has no reason to link the
# daemon's hyper/rustls closure; `cowshed-cli` owns the wiring to the running daemon.
cowshed-gateway-types = { path = "../cowshed-gateway-types" }
getrandom = "0.3"
libc = "0.2"
# DIRENV_WATCHES is zlib-deflated; a pure-Rust inflate, bounded at the call site.
miniz_oxide = "0.8"
plist = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio.workspace = true
# `.cowshed.toml` is read by the real TOML grammar, typed through serde (storage/bootstrap.rs).
toml.workspace = true
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
x509-parser = { version = "0.18", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
# Paused time: a supervisor test lets a minute of Nx daemon probes pass without waiting it out.
tokio = { workspace = true, features = ["test-util"] }
