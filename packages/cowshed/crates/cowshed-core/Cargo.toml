[package]
name = "cowshed-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# This crate's tests are ~150s of serial work on this machine against a 120s
# bounded Nx target. A hosted 3-core macOS runner is ~1.85x slower and runs
# three Nx tasks at once, each nextest on three threads, so a shard gets about
# one core: its wall time is its share of the serial work plus ~13s of archive
# extraction. With three shards the worst ran out of that bound there, 101.9s in
# and 35 tests short; five give each a fifth. Membership is by nextest's hash of
# the test name, so new tests spread themselves.
[package.metadata.smoothbricks.test]
shards = 5

[[bin]]
name = "apfs-benchmark"
path = "src/bin/apfs_benchmark.rs"
test = false
bench = false

[dependencies]
arrow-array = "56"
arrow-buffer = "56"
arrow-ipc = "56"
arrow-schema = "56"
base64 = "0.22"
async-trait = "0.1"
bytes = "1"
# The control-plane data model only. Reconciling the gateway's session table against host
# inventory is a pure function of these values, so the controller has no reason to link the
# daemon's hyper/rustls closure; `cowshed-cli` owns the wiring to the running daemon.
cowshed-gateway-types = { path = "../cowshed-gateway-types" }
getrandom = "0.3"
libc = "0.2"
# DIRENV_WATCHES is zlib-deflated; a pure-Rust inflate, bounded at the call site.
miniz_oxide = "0.8"
plist = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"
tokio.workspace = true
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
x509-parser = { version = "0.18", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
