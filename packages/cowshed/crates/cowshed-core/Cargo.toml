[package]
name = "cowshed-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# This crate's 836 tests are 150.9s of serial work — 80.7s of it in the lib
# binary alone — against a 120s bounded Nx target. On a 3-core hosted macOS
# runner (~1.85x this machine, measured on a matched 572-test subset) one target
# is ~102s: it fits only if nothing goes slightly wrong, and in CI it did not.
# Three shards put the worst at ~21s locally, ~39s hosted. Membership is by
# nextest's hash of the test name, so new tests spread themselves.
[package.metadata.smoothbricks.test]
shards = 3

[[bin]]
name = "apfs-benchmark"
path = "src/bin/apfs_benchmark.rs"
test = false
bench = false

[dependencies]
arrow-array = "56"
arrow-buffer = "56"
arrow-ipc = "56"
arrow-schema = "56"
base64 = "0.22"
async-trait = "0.1"
bytes = "1"
# The control-plane data model only. Reconciling the gateway's session table against host
# inventory is a pure function of these values, so the controller has no reason to link the
# daemon's hyper/rustls closure; `cowshed-cli` owns the wiring to the running daemon.
cowshed-gateway-types = { path = "../cowshed-gateway-types" }
getrandom = "0.3"
libc = "0.2"
plist = "1"
notify = "8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"
tokio.workspace = true
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
x509-parser = { version = "0.18", features = ["verify"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
