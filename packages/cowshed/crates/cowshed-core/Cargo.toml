[package]
name = "cowshed-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[package.metadata.wiring.external]]
item = "merge_tree_paths"
consumer = "private"
why = "a trusted controller probes an uncommitted checkout tree against a newer target without publishing a ref"

# Earlier hosted-CI sizing measured a 3-core macOS runner ~1.85x slower, with three Nx tasks
# competing for its cores and ~13s of archive extraction per batch. Three shards ran out
# 101.9s in with 35 tests left; five were chosen for that workload.
# The same full test set runs in bounded hash partitions, never serialized and with no raised
# timeout. Five shards later exhausted the 120s execution bound on a loaded local host:
# first at 258/264 tests after a 139.8s CPU-token wait outside that bound, then at 212/264.
# Eight reduce each batch's serial work. Membership is nextest's test-name hash, except the slow
# tests .config/nextest-timings.json names, which the exception shards take by measured time.
[package.metadata.smoothbricks.test]
shards = 8

[[bin]]
name = "apfs-benchmark"
path = "src/bin/apfs_benchmark/main.rs"
test = false
bench = false

# The sandbox launcher of a program that links this crate and is not the cowshed binary, which
# is its own (specs/cowshed/04_sandbox.md, "Linux enforcement", "The launcher"): its main is
# `sandbox::launcher_main` and nothing else. Built from this crate so that such a program has a
# launcher of exactly the cowshed-core it links; the test binaries of this workspace are such
# programs, and the Nx target `cowshed:sandbox-exec-bin` builds theirs.
[[bin]]
name = "cowshed-sandbox-exec"
path = "src/bin/sandbox_exec.rs"
test = false
bench = false

[dependencies]
arc-swap = "1"
arrow-array = "56"
arrow-buffer = "56"
arrow-ipc = "56"
arrow-schema = "56"
base64 = "0.22"
blake3 = "1"
async-trait = "0.1"
bytes = "1"
cowshed-apfs = { path = "../cowshed-apfs" }
# The control-plane data model only. Reconciling the gateway's session table against host
# inventory is a pure function of these values, so the controller has no reason to link the
# daemon's hyper/rustls closure; `cowshed-cli` owns the wiring to the running daemon.
cowshed-gateway-types = { path = "../cowshed-gateway-types" }
# Dataset names with their containment rule, and the kernel's mount-source answer, shared with
# the root helper every ZFS mutation goes through (specs/cowshed/09_substrates.md).
cowshed-helper = { path = "../cowshed-helper" }
cowshed-os = { path = "../cowshed-os" }
getrandom = "0.3"
libc = "0.2"
# DIRENV_WATCHES is zlib-deflated; a pure-Rust inflate, bounded at the call site.
miniz_oxide = "0.8"
plist = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio.workspace = true
# `.cowshed.toml` is read by the real TOML grammar, typed through serde (storage/bootstrap.rs).
toml.workspace = true
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
x509-parser = { version = "0.18", features = ["verify"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"
security-framework-sys = "2"

[dev-dependencies]
cowshed-os = { path = "../cowshed-os", features = ["test-hooks"] }
parking_lot = "0.12"
proptest = "1"
# The supervisor actor's census parses this crate's own source (runtime/supervisor/actor_census.rs).
syn = { version = "2", features = ["full", "visit"] }
# Paused time: a supervisor test lets a minute of Nx daemon probes pass without waiting it out.
tokio = { workspace = true, features = ["test-util"] }
