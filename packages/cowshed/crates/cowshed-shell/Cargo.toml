[package]
name = "cowshed-shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# The warm exec host: the process that holds one activated workspace shell and runs each
# command from it. Only binaries that serve as hosts link this crate, so the brush interpreter
# and its dependency closure stay out of cowshed-core, the Node addon and embedding hosts.
[[bin]]
name = "cowshed-shell-host"
path = "src/bin/cowshed_shell_host.rs"
test = false
bench = false

[dependencies]
cowshed-core.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

# The workspace resolves features once for every member (.cargo/config.toml), per target. An
# unconditional edge here would put brush's closure into every wasm32 build: brush enables
# chrono's default `wasmbind`, which links wasm-bindgen into columine's event_processor.wasm and
# gives it `__wbindgen_*` imports no consumer provides. The host never runs on wasm32, so the
# edge is declared only where it can be built.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
brush-builtins = "0.2"
brush-core = "0.5"
brush-parser = "0.4"

[dev-dependencies]
async-trait = "0.1"
bytes = "1"
cowshed-gateway-types = { path = "../cowshed-gateway-types" }
uuid = { version = "1", features = ["v4"] }
