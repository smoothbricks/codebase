[package]
name = "cowshed-types"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Canonical value declarations with no ambient effects and no dependency on storage,
# runtime or the API client; cowshed-gateway-types owns repository-id validation.
[dependencies]
cowshed-gateway-types = { path = "../cowshed-gateway-types" }
cowshed-os = { path = "../cowshed-os" }
lmao-core.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror = "2"

[dev-dependencies]
proptest.workspace = true
