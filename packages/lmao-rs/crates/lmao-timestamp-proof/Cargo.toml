[package]
name = "lmao-timestamp-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Timestamp-accuracy proof instrumentation with shared-memory WASM and NAPI artifacts for span timing"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The .node artifact: napi-rs registration compiles only when requested so
# the wasm build stays dependency-free.
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6"], optional = true }
napi-derive = { version = "2", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
proptest = { workspace = true }
