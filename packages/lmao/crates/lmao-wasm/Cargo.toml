[package]
name = "lmao-wasm"
description = "wasm32 cdylib exposing the SpanBuffer allocator ABI for the TypeScript host with imported memory and host-clock hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `name` is the SHIPPED artifact name, not the package name, so cargo emits
# `allocator.wasm` directly. The TypeScript loader resolves exactly that file
# (src/lib/wasm/wasmAllocator.ts); with producer and consumer naming agreed,
# no downstream step renames it and no rename can serve a stale artifact.
[lib]
name = "allocator"
crate-type = ["cdylib", "rlib"]

[dependencies]
lmao-core = { workspace = true }
lmao-arena = { workspace = true }
