# git-format-staged configuration for SmoothBricks-style monorepos

formatters:
  # ESLint for Astro files (run first as it only handles .astro files)
  eslint:
    command: "eslint-stdout '{}'"
    patterns:
      - '*.astro'
      - '!.*' # Exclude hidden files

  # Biome for JS/TS family (including CommonJS/CTS and ESM .mjs/.mts)
  # Biome check --fix silently succeeds on unparsable stdin; format must refuse it.
  biome:
    command: "biome format --files-ignore-unknown=true --use-editorconfig=true '--stdin-file-path={}'"
    patterns:
      - '*.js'
      - '*.cjs'
      - '*.mjs'
      - '*.ts'
      - '*.cts'
      - '*.mts'
      - '*.jsx'
      - '*.tsx'
      - '*.json'
      - '*.jsonc'
      - '*.html'
      - '*.css'
      - '*.graphql'

  # Prettier owns only file types for which its installed CLI has a parser.
  # --ignore-unknown emits empty stdout for unknown stdin, truncating files.
  prettier:
    command: "prettier --stdin-filepath '{}'"
    patterns:
      - '*.md'
      - '*.markdown'
      - '*.mdx'
      - 'README'
      - '*.yml'
      - '*.yaml'
      - '.prettierrc'
      - '.stylelintrc'
      - '.lintstagedrc'
      - '*.scss'
      - '*.less'
      - '*.pcss'
      - '*.postcss'
      - '*.vue'
      - '*.json5'
      - '*.gql'
      - '*.graphqls'
      - '*.handlebars'
      - '*.hbs'
      # Workflow templates carry __SMOO_*__ placeholders in key position and are
      # not YAML until rendered; the rendered copies are formatted on write.
      - '!packages/nx-plugin/managed/templates/github/workflows/*.yml'

  # rustfmt for Rust files
  rustfmt:
    command: 'rustfmt --edition 2024'
    patterns:
      - '*.rs'

  # gofmt for Go compiler and tooling sources
  gofmt:
    command: 'gofmt'
    patterns:
      - '*.go'

  # Alejandra for Nix files
  alejandra:
    command: 'alejandra'
    patterns:
      - '*.nix'

settings:
  update_working_tree: true
  show_commands: true # Verbose output
