name: Cache node_modules
description: Restore cached Bun workspace dependencies.

runs:
  using: composite
  steps:
    - name: Cache node_modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        # Isolated Bun links and their targets are one dependency tree.
        # ttsc plugin/GOCACHE stay under $TTSC_CACHE_DIR (.cache/ttsc).
        # v2 isolates restore-keys from older Darwin caches with a broken TS dual-package hoist.
        path: |
          node_modules
          ~/.bun/install/cache/links
        # prettier-ignore
        key: ${{ runner.os }}-${{ runner.arch }}-node-v2-{{NODE_MODULES_CACHE_KEY}}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node-v2-
