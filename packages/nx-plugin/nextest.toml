# Injected by @smoothbricks/nx-plugin as `--config-file` on inferred cargo-test
# package targets. `period` matches bun's `--timeout=30000`; `terminate-after = 1`
# kills at that bound instead of warning then waiting another period.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }

# Compile-fail tests compile fixture crates (or rustc a negative contract) as
# their body. `cargo test --no-run` cannot pre-build those; they are generated
# at test time. Filterset matches the class by test name rather than listing
# today's two tests (`compile_fail_cases`, `lesser_capabilities_fail_to_compile_*`).
#
# 180s is provisional: measure the test alone on an idle machine.
# An unbounded run phase is how a hung test becomes a hung lane.
[[profile.default.overrides]]
filter = 'test(/compile_fail|fail_to_compile/)'
slow-timeout = { period = "180s", terminate-after = 1 }

# The full-lifecycle real-APFS tests cannot meet the default deadline, and
# `specs/cowshed/08_testing.md` already contains the arithmetic that proves it.
#
# That spec sets the house rule for real-substrate timing: "CI asserts with a 3×
# multiplier to absorb runner noise". `apfs_integration.rs` measured its lifecycle
# at 14.8s on an IDLE host when it still ran a second image format, so under the
# repo's own noise model CI needed 44.4s. A 30s deadline was therefore unreachable
# by construction: the test was not slow, the bound contradicted the spec. The
# one-format lifecycle measures 6.6-10.6s idle, so the bound below still covers it.
#
# Nor is the cost reducible. The same spec's "Attach floor verdict: not
# flag-reducible" records that `-noverify` saves ~15ms (noise), `-noautofsck`
# nothing, and `diskutil image attach` exposes no equivalent knobs — the ~235-400ms
# per attach is inherent to DiskImages + APFS mount + DiskArbitration, and halving
# it would need DiskImages2 or the diskarbitrationd private API, which the spec
# explicitly forbids budgets from assuming. The lifecycle attaches once per phase
# across adopt, mount, clone-under-churn, checkpoint, restore, retire, reclaim, GC
# and detach, so its floor is a multiple of an irreducible constant.
#
# The alternative was splitting the lifecycle into phase-scoped tests so each fits
# 30s. It loses: every split pays that attach constant again, so the suite's total
# wall time rises to buy a smaller per-test bound; splitting phases buys only a
# number.
#
# 60s is 3× the worst idle measurement (44.4s) rounded up, not a guess. It stays
# bounded because an unbounded run phase is how a hung test becomes a hung lane.
# Re-derive it if the idle measurements in `apfs_integration.rs` change.
#
# Membership is by name and narrower than the class: the fast `real_apfs_*` unit
# tests in the lib keep the 30s default — they passed at 4.4s and 7.3s and have no
# claim on more.
[[profile.default.overrides]]
filter = 'test(/real_apfs_.*_substrate_lifecycle/)'
slow-timeout = { period = "60s", terminate-after = 1 }
