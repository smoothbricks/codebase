# Injected by @smoothbricks/nx-plugin as `--config-file` on inferred cargo-test
# package targets. `period` matches bun's `--timeout=30000`; `terminate-after = 1`
# kills at that bound instead of warning then waiting another period.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }

# Compile-fail tests compile fixture crates (or rustc a negative contract) as
# their body. `cargo test --no-run` cannot pre-build those; they are generated
# at test time. Filterset matches the class by test name rather than listing
# today's two tests (`compile_fail_cases`, `lesser_capabilities_fail_to_compile_*`).
#
# 180s is provisional: measure on an idle machine with `--test-threads=1`.
# An unbounded run phase is how a hung test becomes a hung lane.
[[profile.default.overrides]]
filter = 'test(/compile_fail|fail_to_compile/)'
slow-timeout = { period = "180s", terminate-after = 1 }

# Tests that drive the host's REAL APFS stack — creating, attaching, mounting and
# detaching actual disk images — contend on a single machine-wide serialization
# point: Disk Arbitration and the APFS driver, not on CPU. Measured on this host,
# a read-only `diskutil apfs list -plist` costs 0.7s idle at 33 attached images
# but up to 14.4s while another process is attaching/detaching. A test whose
# verdict depends on how many siblings happen to be mid-attach is measuring the
# scheduler, not the code.
#
# `threads-required` reserves the WHOLE run's thread budget, so each of these runs
# with no other test in flight. Mutual exclusion between them follows for free,
# which is why there is no test group here: a group with `max-threads = 1` would
# stop them contending with EACH OTHER while leaving the other ~830 tests free to
# saturate the same disk, and that was measured to be insufficient — a run where a
# real-APFS test overran also overran an unrelated `job_artifact` test, i.e. the
# suite was starving itself. `num-test-threads` rather than `num-cpus` so the
# reservation still means "everything" under an explicit `--test-threads`.
#
# This bounds contention; it does NOT grant more time. The per-test deadline above
# is unchanged and each of these tests is expected to fit it on its own merits.
# Membership is by name: `real_apfs_*` is the class marker, so a new real-APFS
# test opts in by being named for what it touches. A bare `real_*` filter would be
# wrong here — unrelated `real_*` tests exist in columine-arrow, cowshed-cli and
# cowshed-gateway that touch no disk image at all.
[[profile.default.overrides]]
filter = 'test(/real_apfs_/)'
threads-required = 'num-test-threads'
