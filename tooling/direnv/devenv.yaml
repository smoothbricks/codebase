allowUnfree: true
# MinIO (services.minio) is only used for BunS3Archive integration tests, but its
# nixpkgs package is flagged insecure. Permit it here so contributors don't have to
# touch their personal ~/.config/nixpkgs/config.nix. Bump the date tag when nixpkgs does.
permittedInsecurePackages:
  - minio-2025-10-15T17-29-55Z
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # The devenv modules at a release tag, and with them the CLI: on a hosted
  # runner, install-devenv installs the commit this input locks. Left undeclared,
  # `devenv update` locks devenv's main as it is that minute, and
  # devenv.cachix.org drops a main build after about six weeks, so a cold runner
  # then compiles devenv from source. The aarch64-darwin, aarch64-linux and
  # x86_64-linux builds of every release from v2.0.4 on are pinned there for
  # good, and the x86_64-darwin builds up to v2.1.2, since from v2.2 on devenv
  # builds nothing for x86_64-darwin; some older tags, such as v2.0.3, have no
  # pin. `smoo monorepo check` refuses a lock that is not such a release; the tag
  # moves when someone bumps it.
  devenv:
    url: github:cachix/devenv/v2.3.1?dir=src/modules
  # Go for devenv.smoo.nix, pinned to the patch release ttsc vendors inside its
  # native package (0.34.1 -> go1.27.3); `smoo monorepo check` fails when the two
  # disagree. Our curated channel above cannot supply it — rolling has no Go 1.27 —
  # so this is one leaf package from a nixpkgs that has it.
  #
  # An exact revision rather than the nixpkgs-unstable branch, deliberately: the
  # whole point of this input is to name ONE Go version, so a `devenv update` must
  # not be able to slide it out from under the vendored SDK it is matched to. It
  # moves when someone bumps ttsc and the check says it has to.
  nixpkgs-go:
    url: github:NixOS/nixpkgs/674a2028661e550a97400c1cc992b9cca9a668a1
    flake: true
  # Its own nixpkgs is the single largest duplication in the shell closure. This
  # is a Python script, and on Darwin nixpkgs' python3 retains the whole SDK
  # chain (apple-sdk -> cctools-libtool -> llvm-lib -> clang-lib), so a second
  # nixpkgs revision meant a SECOND copy of all of it: apple-sdk-14.4 362.9 MB,
  # llvm-21.1.8-lib 398.6 MB, clang-21.1.8-lib 301.5 MB, python3 3.13 115.1 MB
  # and their cctools/ld64/xcbuild/libiconv tails. `nix why-depends` traces every
  # one of those to this input alone. Following the fleet nixpkgs collapses them
  # onto the copies rustc and stdenv-darwin already require, at no cost: this
  # flake pins no nixpkgs-specific behaviour, it packages one script.
  git-format-staged:
    url: github:smoothbricks/git-format-staged
    flake: true
    inputs:
      nixpkgs:
        follows: nixpkgs
  rust-overlay:
    url: github:oxalica/rust-overlay
    flake:
      true
      # mbx, the Cargo compiler cache (specs/cowshed/03_caches.md, "mbx"), at the
  # revision cowshed pins (specs/cowshed/14_nix.md, "mbx"): v1.28.0 plus the
  # compact-prediction, scheduler-admission and grant-descriptor changes, from vizanto/mr-boxington. An exact
  # revision, and its own nixpkgs rather than a `follows`: the Nix store path
  # names the build, so the `mbx` a job resolves on PATH and the one cowshed
  # setup installs are the same executable only while both are built from this
  # one locked flake.
  mbx:
    url: github:vizanto/mr-boxington/9d91cf452ec59682a9a4581bdd7e39e2b247be22
    flake: true
